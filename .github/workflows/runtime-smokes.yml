name: runtime-smokes

# Note: Automated PR execution for r1b-terminal, runtime-spine, and uwg-block
# is consolidated into contract-gates.yml per .github/workflow-config.yaml.
# runtime-smokes is retained for manual / on-demand diagnostic execution.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      r1b-terminal: ${{ steps.filter.outputs.r1b-terminal }}
      runtime-spine: ${{ steps.filter.outputs.runtime-spine }}
      uwg-block: ${{ steps.filter.outputs.uwg-block }}
      any: ${{ steps.filter.outputs.any }}
      changed-files: ${{ steps.filter.outputs.changed-files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Classify changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > changed-files.txt
          else
            : > changed-files.txt
            printf '%s\n' \
              "infrastructure/runtime/manual_dispatch.py" >> changed-files.txt
          fi

          python - <<'PY'
          from pathlib import Path
          import os

          changed = [p.strip().replace("\\", "/") for p in Path("changed-files.txt").read_text().splitlines() if p.strip()]

          def matches(path: str, patterns: tuple[str, ...]) -> bool:
              return any(pattern in path for pattern in patterns)

          r1b = any(
              matches(
                  p,
                  (
                      "terminal",
                      "semantic_cache",
                      "r1b",
                      "probe_r1b_terminal_exit.py",
                      "tests/runtime/test_r1b_terminal_exit_proof.py",
                      ".github/workflows/runtime-smokes.yml",
                  ),
              )
              for p in changed
          )
          spine = any(
              p.startswith(
                  (
                      "infrastructure/",
                      "apps_rg/runtime/",
                  )
              )

              or matches(
                  p,
                  (
                      "ops_scripts/ci/verify_runtime_certification_matrix_schema.py",
                      "ops_scripts/ci/verify_runtime_certification_acceptance.py",
                      "ops_scripts/ci/verify_source_divergence.py",
                      ".github/workflows/runtime-smokes.yml",
                  ),
              )
              for p in changed
          )
          uwg = any(
              matches(
                  p,
                  (
                      "DurableWriteGateway",
                      "durable_write_gateway",
                      "mutation",
                      "write_path",
                      "uwg",
                      "tools/certification/regen_uwg_block_latest.py",
                      "tests/runtime/test_cache_fixture_vs_uwg_proof.py",
                      ".github/workflows/runtime-smokes.yml",
                  ),
              )
              for p in changed
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"r1b-terminal={str(r1b).lower()}\n")
              out.write(f"runtime-spine={str(spine).lower()}\n")
              out.write(f"uwg-block={str(uwg).lower()}\n")
              out.write(f"any={str(r1b or spine or uwg).lower()}\n")
              out.write("changed-files<<EOF\n")
              out.write("\n".join(changed))
              out.write("\nEOF\n")
          PY

  r1b-terminal:
    name: r1b-terminal
    needs: changes
    if: needs.changes.outputs.r1b-terminal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: editable
      - name: R1B terminal representative smoke
        run: python -m pytest tests/runtime/test_r1b_terminal_exit_proof.py -p no:xdist -p no:testmon -q --timeout=120

  runtime-spine:
    name: runtime-spine
    needs: changes
    if: needs.changes.outputs.runtime-spine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: editable
      - name: Runtime spine representative smoke
        run: |
          python ops_scripts/ci/verify_runtime_certification_matrix_schema.py
          python ops_scripts/ci/verify_runtime_certification_acceptance.py
          python ops_scripts/ci/verify_source_divergence.py

  uwg-block:
    name: uwg-block
    needs: changes
    if: needs.changes.outputs.uwg-block == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: editable
      - name: UWG block representative smoke
        run: python -m pytest tests/runtime/test_cache_fixture_vs_uwg_proof.py -p no:xdist -p no:testmon -q --timeout=120

  smoke-summary:
    name: smoke-summary
    needs: [changes, r1b-terminal, runtime-spine, uwg-block]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize runtime smoke routing
        env:
          ANY: ${{ needs.changes.outputs.any }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          R1B_RESULT: ${{ needs.r1b-terminal.result }}
          SPINE_RESULT: ${{ needs.runtime-spine.result }}
          UWG_RESULT: ${{ needs.uwg-block.result }}
          CHANGED_FILES: ${{ needs.changes.outputs.changed-files }}
        run: |
          set -euo pipefail
          echo "Changed files:"
          printf '%s\n' "${CHANGED_FILES:-<none>}"

          if [ "${CHANGES_RESULT}" != "success" ]; then
            echo "::error::Runtime-smoke routing failed before lane selection."
            exit 1
          fi

          if [ "${ANY}" != "true" ]; then
            echo "No runtime smoke lanes were relevant to this diff."
            exit 0
          fi

          failed=0
          for lane in "r1b-terminal:${R1B_RESULT}" "runtime-spine:${SPINE_RESULT}" "uwg-block:${UWG_RESULT}"; do
            name="${lane%%:*}"
            result="${lane#*:}"
            echo "${name}: ${result}"
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              failed=1
            fi
          done

          if [ "${failed}" = "1" ]; then
            echo "::error::One or more relevant runtime smoke lanes failed."
            exit 1
          fi
