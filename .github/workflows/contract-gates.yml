name: contract-gates

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tier1-commit-invariants:
    name: Tier 1 Commit Invariants (Hygiene, Budgets, Purity, Schemas, Secrets)
    uses: ./.github/workflows/reusable-python-gate.yml
    with:
      gate-name: "Tier 1 Commit Invariants"
      install-mode: "editable"
      run-command: "python tools/verify_commit.py --all"
      timeout-minutes: 10

  turn-gates-governance:
    name: Mechanical Turn Gates & Operating Invariants
    uses: ./.github/workflows/reusable-python-gate.yml
    with:
      gate-name: "Turn Gates Governance"
      install-mode: "editable"
      run-command: "python tools/validate_turn_gates.py --mode pre-turn"
      timeout-minutes: 5

  implementation-plan-contract:
    name: Implementation Plan Governance Gate
    uses: ./.github/workflows/reusable-python-gate.yml
    with:
      gate-name: "Implementation Plan Governance Gate"
      install-mode: "editable"
      run-command: "python tools/validate_implementation_plan.py"
      timeout-minutes: 5

  config-ssot-enforcement:
    name: Config SSOT Enforcement Gate
    uses: ./.github/workflows/reusable-python-gate.yml
    with:
      gate-name: "Config SSOT Enforcement Gate"
      install-mode: "editable"
      run-command: "python -m tools.config_ssot_agent check"
      timeout-minutes: 5

  governance-regression-suite:
    name: Fast Governance Regression Suite
    uses: ./.github/workflows/reusable-python-gate.yml
    with:
      gate-name: "Fast Governance Regression Suite"
      install-mode: "editable"
      run-command: "python -m pytest tests/test_turn_gates.py tests/test_implementation_plan_governance.py tests/test_hitl_governance_enforcement.py tests/test_model_neutral_naming.py tests/test_unified_agent_architecture.py --timeout=60 -q"
      timeout-minutes: 5

  cli-smokes:
    name: Canonical CLI Smokes (Resume Engine, Outreach Engine, Agents)
    uses: ./.github/workflows/reusable-python-gate.yml
    with:
      gate-name: "Canonical CLI Smokes"
      install-mode: "editable"
      run-command: |
        resume-engine --version
        outreach-engine --version
        python -m agents --version
      timeout-minutes: 5

  contract-gates-summary:
    name: contract-gates-summary
    needs:
      - tier1-commit-invariants
      - turn-gates-governance
      - implementation-plan-contract
      - config-ssot-enforcement
      - governance-regression-suite
      - cli-smokes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate contract gates status
        run: |
          echo "=========================================="
          echo "Contract Gates Summary"
          echo "=========================================="
          echo "tier1-commit-invariants: ${{ needs.tier1-commit-invariants.result }}"
          echo "turn-gates-governance: ${{ needs.turn-gates-governance.result }}"
          echo "implementation-plan-contract: ${{ needs.implementation-plan-contract.result }}"
          echo "config-ssot-enforcement: ${{ needs.config-ssot-enforcement.result }}"
          echo "governance-regression-suite: ${{ needs.governance-regression-suite.result }}"
          echo "cli-smokes: ${{ needs.cli-smokes.result }}"
          echo "=========================================="
          
          if [ "${{ needs.tier1-commit-invariants.result }}" != "success" ] || \
             [ "${{ needs.turn-gates-governance.result }}" != "success" ] || \
             [ "${{ needs.implementation-plan-contract.result }}" != "success" ] || \
             [ "${{ needs.config-ssot-enforcement.result }}" != "success" ] || \
             [ "${{ needs.governance-regression-suite.result }}" != "success" ] || \
             [ "${{ needs.cli-smokes.result }}" != "success" ]; then
            echo "::error::One or more contract gates failed."
            exit 1
          fi
          echo "All contract gates PASSED."
