name: apps-e2e-harness-manual
# Manual apps_* end-to-end auditability harness.
#
# Historical plan: .codex/plans/_archive/2026-05/apps-e2e-auditability-harness-7c2a91.md
#
# Two jobs:
#   1. harness-verifier (manual)
#      Runs the unit + runtime verifier tests against bundles ALREADY
#      on disk. Cheap (~10 s). Catches harness regressions immediately.
#
#   2. manual-emit (workflow_dispatch)
#      Runs `python -m apps_*` for every runnable AppSpec, emits
#      per-app proof bundles + the all-apps matrix, uploads as a
#      GitHub artifact. Heavy (~20-30 min for the full sweep).
#
# Non-goals:
#   * No SHA256 signing of the bundles (apps_e2e bundles are auditability,
#     not certification — see plan §"Out of Scope").
#   * No auto-commit of bundles (the harness writes to artifacts/, which
#     is gitignored; bundles live as workflow artifacts only).

on:
  workflow_dispatch:
    inputs:
      skip_apps:
        description: "Space-separated list of apps_* to skip (e.g. 'apps_lic apps_research')"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  harness-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: dev

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/apps_e2e/ -q --no-header -p no:cacheprovider

      - name: Emit dry-run bundles (uses on-disk run dirs)
        run: |
          python -m tools.certification.apps_e2e.emit_proof_bundle --all --dry-run --skip-non-runnable
          python -m tools.certification.apps_e2e.matrix_builder

      - name: Run shared verifier + matrix + anti-cheat tests
        run: |
          python -m pytest tests/runtime/test_apps_e2e_auditability_harness.py tests/runtime/test_apps_e2e_matrix.py tests/runtime/test_apps_e2e_anti_cheat.py tests/runtime/test_apps_e2e_two_gate_negative_controls.py -q --no-header -p no:cacheprovider

      # ---- W4: Two-gate certification ----
      # Gate 1: bundle emission. MUST pass.
      - name: Gate 1 — apps_e2e_bundle_emission (MUST pass)
        run: |
          python -m ops_scripts.ci.check_apps_e2e_bundle_emission

      # Gate 2: spine certification. BLOCKING as of 2026-05-02 (per ADR-081).
      # All 5 runtime-required apps reached SPINE_COMPLETE_CERTIFIED:
      #   apps_rg, apps_exec, apps_lic, apps_eval, apps_research, apps_rfp
      # Waived (non-runtime or skeleton): apps_qna, apps_underwriting_ai.
      #
      # This gate fails the manual run if any runtime app drifts out of
      # SPINE_COMPLETE_CERTIFIED or a new runtime app is added without
      # being wired through apps_shared.spine_emission.
      #
      # Emergency bypass (operator-only): set APPS_E2E_SPINE_STRICT_BYPASS=1
      # at the env level — logged to artifacts/governance/apps_e2e_strict_bypass.jsonl.
      # See docs/adr/ADR-081-apps-e2e-spine-cert-wireup.md for full history.
      - name: Gate 2 — apps_e2e_spine_certification (BLOCKING)
        run: |
          python -m ops_scripts.ci.check_apps_e2e_spine_certification

      - name: Upload verifier_report.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apps-e2e-verifier-report
          path: artifacts/certification/apps_e2e/verifier_report.json
          retention-days: 14

      # Legacy gate (deprecated 2026-05-02 — kept for transition).
      - name: Legacy gate — check_apps_e2e_harness (deprecated)
        run: |
          python -m ops_scripts.ci.check_apps_e2e_harness

      - name: Upload dry-run matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apps-e2e-dryrun-matrix
          path: artifacts/certification/apps_e2e/apps_e2e_matrix.json
          retention-days: 14

  manual-emit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: harness-verifier
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: dev

      - name: Live manual run (all runnable apps_*)
        env:
          SKIP_APPS: ${{ github.event.inputs.skip_apps }}
        run: |
          if [ -n "$SKIP_APPS" ]; then
            python -m tools.certification.apps_e2e.nightly_run --skip $SKIP_APPS
          else
            python -m tools.certification.apps_e2e.nightly_run
          fi

      - name: Run shared verifier against live bundles
        run: |
          python -m pytest tests/runtime/test_apps_e2e_auditability_harness.py tests/runtime/test_apps_e2e_matrix.py -q --no-header -p no:cacheprovider

      - name: Upload live bundles + matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apps-e2e-live-bundles-${{ github.run_id }}
          path: |
            artifacts/certification/apps_e2e/**/*.json
            artifacts/certification/apps_e2e/**/*.log
          retention-days: 30

