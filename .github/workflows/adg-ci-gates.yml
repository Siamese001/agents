      - name: M13 — Evidence Governance Regression Gate
        run: python tools/eval/retrieval_benchmark.py --regression-check
        env:
          PYTHONPATH: .

      - name: Full gate summary (exit 1 if any enforce-mode gate fails)
        run: python ops_scripts/ci/_adg_ci_gates.py
        env:
          PYTHONPATH: .

      - name: Upload wave0 baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave0-baseline-${{ github.sha }}
          path: ops_scripts/ci/wave0_baseline.json
          if-no-files-found: warn
