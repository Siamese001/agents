name: ADG Full Audit (manual)

on:
  # Right-sized 2026-06-14 (solo workflow): removed the automatic push + pull_request
  # triggers. The ADG audit pipeline is heavy and currently carries infra/schema drift in
  # CI (P0 layer-violation cascade, `entrypoint_kind` schema drift, missing review-template
  # generation, BCG synthesis ImportError, unset ADG_REDIS_URL), so as an auto gate it only
  # produced a chronic red on every PR. Run it on-demand instead — via the Actions
  # "Run workflow" button or `gh workflow run adg-ci-gates.yml`. This matches the
  # right-sizing in PR #366 (which deleted 11 other heavy on-PR workflows) while keeping the
  # ADG gate available when explicitly invoked.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  adg-ci-gates:
    name: ADG full audit
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: editable

      - name: Syntax and import sanity (changed Python files)
        run: python ops_scripts/ci/check_python_syntax.py --verbose --base-ref "${{ github.base_ref || 'main' }}"
        env:
          PYTHONPATH: .

      - name: Install extra dependencies for ADG
        run: |
          python -m pip install redis

      # NOTE: the Audit Pipeline (ADG generator) MUST run before the Redis
      # ingest + staleness verify below. It is what produces artifacts/adg/,
      # which is gitignored and therefore absent in a fresh CI checkout.
      # Ingesting first failed with "ADG artifacts directory not found".
      - name: ADG Audit Pipeline (wrapper — Stage-1 generator + Stage-2 gap report)
        # Plan adg-audit-pipeline-integration-7f2c93: single SSOT entry for
        # the two-stage certification flow. Runs generate_full_adg.py with
        # ADG_CERTIFICATION_MODE=1, cross-checks the gate-invocation
        # manifest against the required-gate registry, then runs the
        # three-bucket gap report against the exact snapshot declared in
        # the generation manifest. --require-runtime-proof is OMITTED
        # until OTel attestation is wired end-to-end (known limitation
        # #1 in docs/guides/ADG_Audit_Pipeline.md).
        run: python tools/adg/run_full_adg_audit.py --mode certification --format both
        env:
          PYTHONPATH: .

      - name: Ingest ADG into Redis
        run: python tools/adg/adg_redis_ingest.py --force
        env:
          PYTHONPATH: .

      - name: ADG Staleness Verify (blocking — confirms ingest against HEAD)
        run: python tools/adg/adg_stale_guard.py
        env:
          PYTHONPATH: .

      - name: Upload ADG audit pipeline manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adg-audit-manifests-${{ github.sha }}
          path: |
            artifacts/adg/adg_gate_invocation_manifest_*.json
            artifacts/adg/adg_generation_manifest_*.json
            artifacts/adg/adg_enforcement_report_*.json
            docs/reports/adg/AUDIT_PIPELINE_RECEIPT.json
            docs/reports/adg/THREE_BUCKET_GAP_REPORT.*
            docs/reports/adg/three_graph_test_rollup.json
          if-no-files-found: warn

      - name: ADG three-graph manifest (quick strict — plane 2)
        # ADR-081: manifest SSOT; audit wrapper records three_bucket_manifest_quick.
        # Re-run here for explicit CI visibility when using committed snapshot post-audit.
        run: |
          python -c "
          import json, subprocess, sys
          from pathlib import Path
          root = Path('.')
          manifests = sorted(
              (root / 'artifacts' / 'adg').glob('adg_generation_manifest_*.json'),
              key=lambda p: p.stat().st_mtime,
          )
          manifests = [p for p in manifests if p.name != 'adg_generation_manifest_latest.json']
          if not manifests:
              print('skip: no generation manifest')
              sys.exit(0)
          gen = json.loads(manifests[-1].read_text(encoding='utf-8'))
          snap = gen.get('sqlite_path') or gen.get('snapshot_path')
          if not snap or not Path(snap).is_file():
              print('skip: snapshot missing')
              sys.exit(0)
          rc = subprocess.call([
              sys.executable,
              'ops_scripts/ci/run_adg_three_graph_tests.py',
              '--suite', 'quick', '--strict', '--snapshot', snap,
          ])
          sys.exit(rc)
          "
        env:
          PYTHONPATH: .

      - name: Expected-Wiring Gate (declared call-site assertions)
        # Runs immediately after ADG ingest so wiring regressions surface at the
        # ADG step, not at pre-commit. Reads config/expected_wiring.yaml + asserts
        # each required_call is present in its entry_symbol's AST subtree.
        # Also invoked locally at the end of `python tools/generate_full_adg.py`.
        run: python ops_scripts/ci/check_expected_wiring.py
        env:
          PYTHONPATH: .

      - name: Config-Reference Gate (env-flag declaration integrity)
        # Asserts every os.getenv / os.environ read resolves to either a key
        # declared in .env.example, or an allowlisted external/OS-provided flag.
        # Baseline ratchet — only NEW undeclared flags fail the build.
        run: python ops_scripts/ci/check_config_references.py --allow-unreferenced
        env:
          PYTHONPATH: .

      - name: Lifecycle-Pair Gate (resource open/close symmetry)
        # Enforces that every declared opener (sqlite3.connect, open, redis.Redis)
        # has a matching closer in the enclosing function (with-stmt, .close(),
        # or self.<attr> assignment). Baseline ratchet — NEW leaks fail the build.
        run: python ops_scripts/ci/check_lifecycle_pairs.py
        env:
          PYTHONPATH: .

      - name: Exception-Contract Gate (raise/catch symmetry over ADG fan-in)
        # For each declared contract in config/exception_contracts.yaml,
        # resolves the raiser's callers via ADG fan-in and asserts at least
        # require_n_handlers of them catch the declared exception class.
        run: python ops_scripts/ci/check_exception_contract.py
        env:
          PYTHONPATH: .

      - name: Test-Harness Coverage Gate (structural — every prod module has a test import)
        # Queries ADG for production modules (apps_*/engines,
        # apps_*/integrations) that have ZERO imports edge from any file under
        # tests/. Baseline ratchet — fails only on NEW uncovered modules.

        run: python ops_scripts/ci/check_test_harness_coverage.py
        env:
          PYTHONPATH: .

      - name: Audit-Uncovered Gates (AUDIT_1..6 — SSOT, observability, triage SLA)
        # Six ratchets covering categories not previously enforced by ADG CI:
        #   AUDIT_1  SSOT magic constants in 3+ layers
        #   AUDIT_2  high-fan-in modules with no observability edges
        #   AUDIT_3  hardcoded external-service literals outside SSOT
        #   AUDIT_4  cross-mainline dispatchers (3+ layers)
        #   AUDIT_5  env vars referenced outside config layers
        #   AUDIT_6  HIGH/CRITICAL severity rows untriaged (Tier-B hard-block at 30d)
        # All ratchet-mode (current ≤ baseline) plus AUDIT_6 has an embedded
        # Tier-B hard-block for HIGH/CRITICAL untriaged > 30 days. AUDIT_6
        # closes the severity × disposition coverage gap surfaced in Phase 16.
        # Plan: .windsurf/plans/audit-uncovered-gates-and-remediation-627368.md
        run: |
          python ops_scripts/ci/check_ssot_magic_constants.py
          python ops_scripts/ci/check_observability_on_high_fanin.py
          # AUDIT_3 (check_external_service_literal_ssot) removed (notion-wave-enforcement-removal):
          # the Notion-ID literal enforcement gate is retired.
          python ops_scripts/ci/check_cross_mainline_dispatcher.py
          # AUDIT_5 removed (ADR-081): config-ref gate owns undeclared env flags.
          python ops_scripts/ci/check_violation_aging_sla.py
        env:
          PYTHONPATH: .

      - name: ADG enforcement violation log delta gate (P3)
        # Fails the build when artifacts/governance/adg_first_violations.jsonl,
        # graph_layer_violations.jsonl, or plan_evidence_violations.jsonl
        # grew relative to the base branch. Converts the append-only audit
        # trail into a PR-level deterrent. Override: ADG_VIOLATION_LOG_DELTA_BYPASS=1.
        run: python ops_scripts/ci/check_adg_violation_log_delta.py
        env:
          PYTHONPATH: .
          ADG_VIOLATION_LOG_BASE_BRANCH: ${{ github.base_ref || 'main' }}

      - name: Test concentration ratchet gate (advisory)
        # Reports test-investment drift vs ratchet baseline:
        #   - over-invested: density > 50.0 (test_count / fan_in)
        #   - under-invested: fan_in >= 15, tests = 0, has semantic edges
        # Default mode advisory (exit 0); set TEST_CONCENTRATION_GATE_STRICT=1
        # in CI env to enforce. Bypass: TEST_CONCENTRATION_GATE_BYPASS=1.
        run: python ops_scripts/ci/check_test_concentration_ratio.py
        env:
          PYTHONPATH: .

      - name: M1 — Determinism Gate (warn mode until W4 exit)
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          os.environ.setdefault('ADG_CI_GATES_WARN_ALL', '0')
          from ops_scripts.ci._adg_ci_gates import cmd_check
          # Individual gate check via status print
          from ops_scripts.ci._adg_ci_gates import _get_gpc, _load_baseline, _eval_m1
          cur = _get_gpc()
          bl = _load_baseline()
          passed, msg = _eval_m1(cur, bl.get('snapshot', {}))
          mode = bl.get('gate_modes', {}).get('M1', 'warn')
          print(f'M1 [{mode}]: {\"PASS\" if passed else \"FAIL/WARN\"} — {msg}')
          if not passed and mode == 'enforce':
              sys.exit(1)
          "
        env:
          PYTHONPATH: .

      - name: M2 — Dispatch Visibility Gate (warn mode until W2 exit)
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from ops_scripts.ci._adg_ci_gates import _get_gpc, _load_baseline, _eval_m2
          cur = _get_gpc()
          bl = _load_baseline()
