      - name: M11 — Dead Import Regression Gate
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from ops_scripts.ci._adg_ci_gates import _get_gpc, _load_baseline, _eval_m11
          cur = _get_gpc()
