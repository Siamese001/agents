name: outreach-pipeline-ci

on:
  pull_request:
    paths:
      - "outreach_engine/**"
      - "tests/unit/test_*outreach*"
      - "tests/unit/test_live_llm_wave4_outreach_engine.py"
      - ".github/workflows/outreach-pipeline-ci.yml"
      - ".github/workflows/reusable-python-gate.yml"
  push:
    branches: [main]
    paths:
      - "outreach_engine/**"
      - "tests/unit/test_*outreach*"
      - "tests/unit/test_live_llm_wave4_outreach_engine.py"
      - ".github/workflows/outreach-pipeline-ci.yml"
      - ".github/workflows/reusable-python-gate.yml"
  workflow_dispatch:

concurrency:
  group: outreach-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  outreach-engine-core:
    name: Outreach Engine Core CLI & Live Gate
    uses: ./.github/workflows/reusable-python-gate.yml
    with:
      gate-name: "Outreach Engine Core CLI & Live Gate"
      install-mode: "editable"
      run-command: "python -m pytest tests/unit/test_outreach_engine_unified_cli.py tests/unit/test_live_llm_wave4_outreach_engine.py -v --tb=short"
      timeout-minutes: 5

  outreach-api-contracts:
    name: Outreach API & Contract Verification Gate
    uses: ./.github/workflows/reusable-python-gate.yml
    with:
      gate-name: "Outreach API & Contract Verification Gate"
      install-mode: "editable"
      run-command: "python -m pytest outreach_engine/tests/test_outreach_engine_api.py outreach_engine/tests/test_unified_cli.py outreach_engine/tests/test_smoke_pipeline.py -q --tb=short"
      timeout-minutes: 5

  outreach-research-council:
    name: Outreach Research & Adversarial Council Gate
    uses: ./.github/workflows/reusable-python-gate.yml
    with:
      gate-name: "Outreach Research & Adversarial Council Gate"
      install-mode: "editable"
      run-command: "python -m pytest outreach_engine/tests/test_research_briefing.py outreach_engine/tests/test_research_cost_optimization.py outreach_engine/tests/test_research_governance_truth.py outreach_engine/tests/test_adversarial_council_remediation.py outreach_engine/tests/test_executive_judge_panel.py -q --tb=short"
      timeout-minutes: 5

  outreach-composition-validators:
    name: Outreach Composition & Validators Gate
    uses: ./.github/workflows/reusable-python-gate.yml
    with:
      gate-name: "Outreach Composition & Validators Gate"
      install-mode: "editable"
      run-command: "python -m pytest outreach_engine/tests/test_template_driven_composition.py outreach_engine/tests/test_touch_sequence.py outreach_engine/tests/test_touch_sequence_hardening.py outreach_engine/tests/test_compiler.py outreach_engine/tests/test_validators.py -q --tb=short"
      timeout-minutes: 5

  outreach-pipeline-summary:
    name: outreach-pipeline-summary
    needs:
      - outreach-engine-core
      - outreach-api-contracts
      - outreach-research-council
      - outreach-composition-validators
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate consolidated pipeline status
        run: |
          echo "=========================================="
          echo "Outreach Pipeline CI Gate Summary"
          echo "=========================================="
          echo "outreach-engine-core: ${{ needs.outreach-engine-core.result }}"
          echo "outreach-api-contracts: ${{ needs.outreach-api-contracts.result }}"
          echo "outreach-research-council: ${{ needs.outreach-research-council.result }}"
          echo "outreach-composition-validators: ${{ needs.outreach-composition-validators.result }}"
          echo "=========================================="
          
          if [ "${{ needs.outreach-engine-core.result }}" != "success" ] || \
             [ "${{ needs.outreach-api-contracts.result }}" != "success" ] || \
             [ "${{ needs.outreach-research-council.result }}" != "success" ] || \
             [ "${{ needs.outreach-composition-validators.result }}" != "success" ]; then
            echo "::error::One or more outreach pipeline quality gates failed."
            exit 1
          fi
          echo "All outreach quality gates PASSED."
