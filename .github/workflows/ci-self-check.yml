name: ci-self-check

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/workflow-config.yaml"
      - "ops_scripts/ci/audit_required_checks.py"
      - "ops_scripts/ci/check_workflow_references.py"
      - "ops_scripts/ci/check_adg_metric_registry.py"
      - "ops_scripts/ci/check_adg_query_plans.py"
      - "tools/adg/core/query_catalog.py"
      - "ops_scripts/ci/check_adg_writer_authority.py"
      - "tools/adg/contracts/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-reference-check:
    name: workflow-reference-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: minimal
      - name: Check changed workflow/action references
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            python ops_scripts/ci/check_workflow_references.py --changed-only --base-sha "${PR_BASE_SHA}" --head-sha "${HEAD_SHA}"
          elif [ "${EVENT_NAME}" = "push" ] && [ -n "${PUSH_BASE_SHA}" ]; then
            python ops_scripts/ci/check_workflow_references.py --changed-only --base-sha "${PUSH_BASE_SHA}" --head-sha "${HEAD_SHA}"
          else
            python ops_scripts/ci/check_workflow_references.py --all
          fi
      - name: Audit required-check manifest
        run: python ops_scripts/ci/audit_required_checks.py --config .github/workflow-config.yaml
      - name: Validate ADG metric registry
        run: python ops_scripts/ci/check_adg_metric_registry.py
      - name: Validate ADG SQLite writer authority
        run: python ops_scripts/ci/check_adg_writer_authority.py
