workflows:
  contract-gates:
    lanes:
      terminal-cleanup:
        match:
          - "*.py"
          - "ops_scripts/**"
          - "tools/**"
          - "scripts/**"
          - ".github/workflows/**"
        command: python ops_scripts/ci/check_terminal_cleanup.py --verbose --fail-on-new-only
      pytest-config:
        match:
          - "pyproject.toml"
          - "pytest.ini"
          - "tox.ini"
          - "setup.cfg"
          - ".github/workflows/**"
        command: python ops_scripts/ci/_validate_pytest_config.py --strict
      config-sync:
        match:
          - "AGENTS.md"
          - ".mcp.json"
          - ".codex/mcp-notes.md"
          - ".codex/rules/**"
          - ".codex/skills/mcp-integration/**"
          - ".github/workflows/**"
          - ".github/actions/**"
          - "ops_scripts/ci/**"
          - "tools/generate/**"
        command: python ops_scripts/ci/check_mcp_sync_integrity.py && python ops_scripts/ci/check_agents_mcp_coverage.py && python ops_scripts/ci/check_agents_md_sync.py
      codex-adapter:
        match:
          - "AGENTS.md"
          - ".mcp.json"
          - "docs/codex-primary-execution.md"
          - "scripts/governance/verify_codex_primary.py"
          - ".codex/automations/**"
          - ".codex/hooks/**"
          - ".codex/rules/**"
          - ".codex/skills/structured-reasoning/**"
          - ".codex/skills/mcp-integration/**"
        command: python scripts/governance/verify_codex_primary.py --repo-only
      adg-report-mece:
        match:
          - ".codex/automations/adg-audit-and-burndown/automation.toml"
          - ".codex/governance/scripts/post_agent_adg_burndown_inline_audit.py"
          - ".codex/governance/scripts/post_agent_runtime_rca_audit.py"
          - ".codex/rules/adg-post-run-burndown.md"
          - "tools/generate/generate_full_adg.py"
          - "tools/adg/run_full_adg_audit.py"
          - "ops_scripts/ci/adg_gates/run.py"
          - "tools/reports/adg_bcg_adapter.py"
          - "tools/reports/adg_bcg_executive_synthesis.py"
          - "tools/reports/adg_burndown_report.py"
          - "tools/reports/adg_run_output_bundle.py"
          - "ops_scripts/ci/verify_adg_report_mece.py"
          - "tests/unit/codex/test_adg_audit_automation_contract.py"
          - "tests/unit/ops_scripts/ci/test_verify_adg_report_mece.py"
          - "tests/unit/ops_scripts/ci/adg_gates/**"
          - "tests/unit/tools/generate/test_generate_full_adg_failfast.py"
          - "tests/unit/tools/generate/test_simplification_e2e_9b4c27.py"
          - "tests/unit/tools_adg/test_run_full_adg_audit.py"
          - "tests/unit/tools/reports/**"
          - "docs/reports/adg/adg_bcg_*"
          - "docs/reports/adg/adg_burndown_report.md"
          - ".github/ci-lanes.yaml"
          - ".github/workflows/adg-hardening-contracts.yml"
          - ".github/workflows/contract-gates.yml"
        command: >-
          python -m pytest tests/unit/ops_scripts/ci/test_verify_adg_report_mece.py
          -p no:xdist -p no:testmon -q --timeout=120
      apps-rg-prompt-judge-sync:
        match:
          - "apps_rg/prompt_assembly/**"
          - "apps_rg/runtime/sections/**"
          - "apps_rg/runtime/validators/**"
          - "apps_rg/runtime/judges/**"
          - "artifacts/apps_rg/prompt_authority/**"
          - "ops_scripts/ci/check_apps_rg_prompt_judge_sync.py"
          - "ops_scripts/ci/check_section_x2_x1d_drift.py"
          - ".github/workflows/contract-gates.yml"
        command: python ops_scripts/ci/check_apps_rg_prompt_judge_sync.py
      apps-e2e-harness-verifier:
        match:
          - "tools/certification/apps_e2e/**"
          - "tests/unit/apps_e2e/**"
          - "tests/runtime/test_apps_e2e*"
          - "scripts/compile_apps_e2e_signoff.py"
        command: >-
          python -m pytest
          tests/unit/apps_e2e/
          tests/runtime/test_apps_e2e_auditability_harness.py
          tests/runtime/test_apps_e2e_matrix.py
          tests/runtime/test_apps_e2e_anti_cheat.py
          tests/runtime/test_apps_e2e_two_gate_negative_controls.py
          -q --no-header -p no:cacheprovider
      eval-smoke:
        match:
          - "apps_eval/**"
          - "tools/eval/**"
          - "config/judges/**"

          - "config/eval/**"
          - "tests/**/eval*"
        command: >-
          python tools/eval/run_capability_regression.py
          --rubrics config/judges/rubrics.yaml
          --suite capability
          --smoke
          --out artifacts/eval/pr_smoke.json
      r1b-terminal:
        match:
          - "terminal"
          - "semantic_cache"
          - "r1b"
          - "probe_r1b_terminal_exit.py"
          - "tests/runtime/test_r1b_terminal_exit_proof.py"
          - ".github/workflows/contract-gates.yml"
        command: >-
          python -m pytest tests/runtime/test_r1b_terminal_exit_proof.py
          -p no:xdist -p no:testmon -q --timeout=120
      runtime-spine:
        match:
          - "apps_rg/runtime/l5/**"

          - "apps_rg/runtime/bindings/**"
          - "apps_rg/runtime/spine/**"
          - "apps_rg/runtime/schemas/**"
          - "apps_rg/cache/r1b_uwg_**"
          - "apps_rg/cache/r1b_governed_receipt_emission.py"
          - "tests/unit/apps_rg/test_l5_*"
          - "tests/_apps_contract/test_apps_rg_l5_*"
          - "ops_scripts/ci/check_apps_rg_l5_*"
          - "ops_scripts/ci/check_apps_rg_no_direct_durable_writes.py"
          - "ops_scripts/ci/verify_runtime_certification_matrix_schema.py"
          - "ops_scripts/ci/verify_runtime_certification_acceptance.py"
          - "ops_scripts/ci/verify_source_divergence.py"
          - ".github/ci-lanes.yaml"
          - ".github/workflows/contract-gates.yml"
        command: >-
          python ops_scripts/ci/verify_runtime_certification_matrix_schema.py
          && python ops_scripts/ci/verify_runtime_certification_acceptance.py
          && python ops_scripts/ci/verify_source_divergence.py
      uwg-block:
        match:
          - "DurableWriteGateway"
          - "durable_write_gateway"
          - "mutation"
          - "write_path"
          - "uwg"
          - "tools/certification/regen_uwg_block_latest.py"
          - "tests/runtime/test_cache_fixture_vs_uwg_proof.py"
          - ".github/workflows/contract-gates.yml"
        command: >-
          python -m pytest tests/runtime/test_cache_fixture_vs_uwg_proof.py
          -p no:xdist -p no:testmon -q --timeout=120
  runtime-smokes:
    lanes:
      r1b-terminal:
        match:
          - "terminal"
          - "semantic_cache"
          - "r1b"
          - "probe_r1b_terminal_exit.py"
          - "tests/runtime/test_r1b_terminal_exit_proof.py"
          - ".github/workflows/runtime-smokes.yml"
        command: >-
          python -m pytest tests/runtime/test_r1b_terminal_exit_proof.py
          -p no:xdist -p no:testmon -q --timeout=120
      runtime-spine:
        match:
          - "apps_rg/runtime/l5/**"

          - "apps_rg/runtime/bindings/**"
          - "apps_rg/runtime/spine/**"
          - "apps_rg/runtime/schemas/**"
          - "apps_rg/cache/r1b_uwg_**"
          - "tests/unit/apps_rg/test_l5_*"
          - "tests/_apps_contract/test_apps_rg_l5_*"
          - "ops_scripts/ci/check_apps_rg_l5_*"
          - "ops_scripts/ci/check_apps_rg_no_direct_durable_writes.py"
          - "ops_scripts/ci/verify_runtime_certification_matrix_schema.py"
          - "ops_scripts/ci/verify_runtime_certification_acceptance.py"
          - "ops_scripts/ci/verify_source_divergence.py"
          - ".github/ci-lanes.yaml"
          - ".github/workflows/runtime-smokes.yml"
        command: >-
          python ops_scripts/ci/verify_runtime_certification_matrix_schema.py
          && python ops_scripts/ci/verify_runtime_certification_acceptance.py
          && python ops_scripts/ci/verify_source_divergence.py
      uwg-block:
        match:
          - "DurableWriteGateway"
          - "durable_write_gateway"
          - "mutation"
          - "write_path"
          - "uwg"
          - "tools/certification/regen_uwg_block_latest.py"
          - "tests/runtime/test_cache_fixture_vs_uwg_proof.py"
          - ".github/workflows/runtime-smokes.yml"
        command: >-
          python -m pytest tests/runtime/test_cache_fixture_vs_uwg_proof.py
          -p no:xdist -p no:testmon -q --timeout=120
