[pytest]
# Core path semantics configuration
minversion = 6.0

# Ensure repo root is on sys.path for all workers (including pytest-xdist)
# This makes tools.adg, apps_*, agentic_core importable in every worker
pythonpath = . resume_graph_engine/src outreach_engine/src

# Test discovery paths
testpaths = apps_eval/tests resume_graph_engine/tests outreach_engine/tests

# File and pattern discovery
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

# Path exclusion patterns
norecursedirs = .* build dist CVS _darcs {arch} *.egg __pycache__ .pytest_cache _archived_obsolete

# Execution semantics
# Aligned with pyproject.toml (SSOT) per pytest-config-ssot strict-mode gate
# (ops_scripts/ci/_validate_pytest_config.py). Workers and dist mode mirror
# the pyproject CI values (-n 24 --dist=worksteal). The `--cov*` flags stay
# in pyproject because they are CI-only; pytest.ini stays IDE-friendly by
# omitting them so Windsurf/VS Code do not load coverage during interactive
# discovery.
# xdist (-p xdist -n 24 --dist=worksteal) is intentionally NOT in addopts here.
# It lives in pyproject.toml [tool.pytest.ini_options] (CI-only path).
# Keeping xdist out of pytest.ini prevents the Windsurf/VS Code test explorer
# from spawning 24 worker processes during collection-only discovery, which
# causes DiscoveryError in the IDE testing panel.
# To run with parallelism locally: pytest -p xdist -n auto --dist=worksteal
#
# Note: pytest-timeout is loaded transitively via a conftest.py somewhere in the
# tree, so we do NOT add `-p pytest_timeout` here — that would cause a
# "Plugin already registered under a different name" error.
# Fail fast on collection/setup errors. Continuing after collection errors can
# leave plugin teardown without a printable traceback in scoped local runs.
addopts = --timeout=180 --strict-markers --strict-config --tb=short -v --import-mode=importlib --ignore=lib64 --ignore=lib --ignore=tests/unit/apps_rg/test_ds_r7_jd_interactive.py

# Standard markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    contract_harness_live: full python -m apps_rg subprocess lane proof (skip with APPS_RG_CONTRACT_HARNESS_FAST=1)
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests
    governance: marks tests that codify governance/full-proof gaps (tests/governance/) — see .windsurf/plans/apps-rg-governed-runtime-b8d4f1.md
    unit_min_deps: marks tests with minimal dependencies
    sovereign_hardening: marks sovereign hardening tests
    guardian: marks guardian tests
    manual: Manual verification tests that create temporary violations
    serial: Tests that must run serially (shared Redis state, not xdist-safe)
    e2e: marks end-to-end tests
    hardening: marks hardening tests
    aggressive: marks aggressive tests
    ssot: marks SSOT tests
    retrieval_guard: marks retrieval stack regression tests (SR, HSE, Titanium, bge_runtime)
    eval_pipeline: marks tests belonging to the evaluation pipeline acceptance suite (live gate, async future-run, promotion/handoff, adoption smoke)
    eval_capability: marks LJH5.2 capability eval tasks (expected to start at low pass rate — hill-climbing)
    eval_regression: marks LJH5.2 regression eval tasks (expected >=98% pass@1 — backsliding detector)
    adg_runtime: ADG classifier — file imports L2/L3 production AND has semantic edges (real runtime exercise)
    adg_behavioral: ADG classifier — file imports production AND has semantic edges (any layer)
    adg_contract: ADG classifier — file imports production but only via `imports` edges (no flows_to / writes_to)
    adg_tooling: ADG classifier — file only imports `tools/` or `ops_scripts/`, not production
    adg_stdlib: ADG classifier — file has zero production or tooling imports (stdlib / fixtures / contract types)
    adg_otel: ADG classifier — file imports an OTel/telemetry/trace production node
    runtime_observability: capture OTel spans into runtime ADG store on test teardown (W2 P2.1, plan adg-three-bucket-unified-c4f8e2)
    adg_safety: ADG classifier — file imports an L5 safety production node
    adg_l0: ADG classifier — file imports agentic_core/L0_* (routing)
    adg_l1: ADG classifier — file imports agentic_core/L1_* (cognition)
    adg_l2: ADG classifier — file imports agentic_core/L2_* (execution)
    adg_l3: ADG classifier — file imports agentic_core/L3_* (orchestration)
    adg_l4: ADG classifier — file imports agentic_core/L4_* (state)
    adg_l5: ADG classifier — file imports agentic_core/L5_* (safety)
    adg_l6: ADG classifier — file imports agentic_core/L6_* (observability)
    adg_apps_eval: ADG classifier — file imports apps_eval/
    adg_apps_exec: ADG classifier — file imports apps_exec/
    adg_apps_lic: ADG classifier — file imports apps_lic/
    adg_apps_research: ADG classifier — file imports apps_research/
    adg_apps_rg: ADG classifier — file imports apps_rg/
    adg_apps_shared: ADG classifier — file imports apps_shared/
    adg_apps_underwriting_ai: ADG classifier — file imports apps_underwriting_ai/
    network: requires live outbound HTTPS for the test (apps_rg judges: set APPS_RG_ENABLE_NETWORK_TESTS=1 under pytest)
    apps_contract: marks app contract convergence/e2e tests

