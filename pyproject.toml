[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["resume_graph_engine*", "apps_rg_v2*", "outreach_engine*", "apps_exec*", "apps_research*", "apps_eval*"]
exclude = ["tests*", "ops_scripts*", "data*", "archives*", "artifacts*"]

[project]
name = "agents"
version = "1.0.0"
description = "Sovereign Agentic Architecture with Zero-Loss Merge"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Agentic Team", email = "team@agentic.dev"}
]
dependencies = [
    "pydantic>=2.0.0",
    "google-genai>=1.0.0",
    "pinecone>=5.0.0",
    "redis>=5.0.0",
    "libcst>=1.1.0",         # MANDATORY: Deterministic AST serialization (Cap 1.4)
    "cryptography>=41.0.0",  # MANDATORY: Signed Guardian artifacts (Cap 7.2)
    "aiofiles>=23.0.0",
    "jinja2>=3.1.0",
    "networkx>=3.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "tenacity>=8.2.0",
    "tqdm>=4.65.0",
    "watchdog>=3.0.0",
    "opentelemetry-api>=1.25.0",      # MANDATORY: Runtime ADG backbone (Cap 4.1)
    "opentelemetry-sdk>=1.25.0",      # MANDATORY: Runtime ADG backbone (Cap 4.1)
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",  # OTLP gRPC exporter for production backends
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",  # OTLP HTTP exporter for gRPC-blocked environments
    "prometheus-client>=0.19.0",  # MANDATORY: Prometheus metrics for L6 observability (Wave 0)
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
    "duckdb>=0.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
    "pydantic-settings>=2.0.0",
    "pytest>=7.4.0",                  # Used in L5_safety/enforcement
    "rank-bm25>=0.2.0",
    "openai>=1.0.0",
    "gitpython>=3.1.0",
    "pytz>=2023.3",
    "tree-sitter>=0.20.0",
    "tree-sitter-python>=0.20.0",
    "boto3>=1.28.0",
    "kubernetes>=28.0.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "neo4j>=5.12.0",
    "pypdf>=3.17.0",
    "pypdf2>=3.0.0",
    "python-docx>=1.1.0",
]

# [project.scripts]
# Console entry points removed - use Python module invocation instead:
#   python -m tools.adg_cli <args>
#   python -m tools.adg.adg_stale_guard
#   python -m tools.adg.adg_test_selector --from-diff
# See FAST_DEV_COMMANDS.md for full command reference

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.6.0",
    "pytest-testmon>=2.1.0",
    "pytest-timeout>=2.3.0",
    "pytest-rerunfailures>=14.0",
    "pre-commit>=3.7.0",
    "pip-tools>=7.4.0",
    "uv>=0.6.0",
    "watchfiles>=0.23.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
telemetry = [
    # Moved to main dependencies - OpenTelemetry is MANDATORY for runtime ADG
    # Keeping group for backward compatibility during transition
]
infra = [
    "vllm>=0.2.0",
    "anthropic>=0.5.0",
    "torch>=2.0.0",
    "pdfplumber>=0.10.0",
    "pdf2image>=1.16.0",
    "pytesseract>=0.3.10",
    "waitress>=2.1.0",
    "rich>=13.0.0",
    "plotly>=5.18.0",
    "dash>=2.14.0",
    "livereload>=2.6.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyvis>=0.3.2",
    "graphviz>=0.20.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
# Workload-aware defaults for AMD 9950X3D:
# - 24 workers with worksteal (default for mixed pytest workloads)
# - Fixture-heavy: 18 workers with loadscope
# - File-isolated: 20 workers with loadfile
addopts = "--cov=agentic_core --cov-branch --cov-report=term-missing --cov-report=html:artifacts/reports/coverage_html --cov-fail-under=100 -ra -v -n 24 --dist=worksteal --timeout=180"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "unit: Individual component tests",
    "integration: Zero-loss merge and transactional tests",
    "e2e: End-to-end workflow tests",
    "slow: Long-running tests",
    "guardian: Architectural integrity checks",
    "manual: Manual verification tests that create temporary violations",
    "serial: Tests that must run serially (shared Redis state, not xdist-safe)",
]

[tool.coverage.run]
branch = true
# Explicitly set the source to avoid ambiguity
source = ["agentic_core"]
omit = [
    "*/tests/*",
    "*/stubs/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/archives/*"
]

[tool.coverage.report]
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "@abstractmethod",
    "@abc.abstractmethod"
]

[tool.coverage.html]
directory = "artifacts/reports/coverage_html"

[tool.black]
line-length = 110
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | archives
  | stubs
)/
'''

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "archives",
    "stubs",
    ".backup",
    ".sovereign_healing_backup",
]

[tool.ruff.lint]
# P0-P4 Tiered Selectors (from priority_definitions.json SSOT)
# P0 (Critical - 10 rules): F821,F401,B012,B904,S102,S307,S601,F541,B013,B015
# P1 (High - 20 rules): B002,B006,B009,B010,B019,B027,S105,S106,S107,S108,S311,S324,S603,S607,UP028,C401,C402,C403,C404,B904
# P2 (Medium - 18 rules): E402,E721,E731,F811,B007,B011,B023,B024,B028,C405,C406,C408,C409,C410,C411,COM812,COM819,I001
# P3 (Low - 14 rules): E501,W291,W292,W293,W505,T201,T203,UP001,UP003,UP004,UP005,UP008,UP009,UP010
# P4 (Info - 10 rules): D100,D101,D102,D103,ERA001,F403,F822,A001,A002,A004
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "T20", # flake8-print (prevent observability leaks)
    "ERA", # eradicate (no commented-out code in production)
]
# Hardening for Invariant P3: No Silent State Mutation
# Enforces that all mutation occurs through explicit execution paths.
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "S101",  # allow assert statements in tests
    "E402",  # import-not-at-top: intentional deferred imports in agents/validators
    "E501",  # line-too-long: ruff-format handles wrapping; remaining are strings/comments
    "E722",  # bare-except: used intentionally in resilience/healing code (guardian: allow-silent_swallower)
    "E741",  # ambiguous-variable-name: single-letter vars used in comprehensions/lambdas
    "F403",  # import-star: used in __init__.py re-export patterns
    "F822",  # undefined-export: __all__ entries resolved at runtime via lazy loading
    "ERA001",  # commented-out code: used for documentation/reference in config files
    "T201",  # print: used extensively in agent output/logging
    "S110",  # try-except-pass: used intentionally in resilience/healing code
    "S112",  # try-except-continue: used intentionally in batch processing loops
    "B904",  # raise-without-from-inside-except: healing code re-raises with context
    "S324",  # hashlib-insecure-hash: used for checksums/fingerprints, not crypto
    "S311",  # non-cryptographic-random: used for jitter/sampling, not security
    "S108",  # hardcoded-temp-file: temp paths are intentional in healing/backup code
    "S105",  # hardcoded-password-string: false positives on config key names
    "B007",  # unused-loop-control-variable: used in enumerate/zip patterns
    "B018",  # useless-expression: used as type assertions and docstring guards
    "A001",  # builtin-variable-shadowing: domain terms (type, id, input, format)
    "A002",  # builtin-argument-shadowing: domain terms in method signatures
    "A004",  # builtin-import-shadowing: re-export patterns in __init__.py
    "B023",  # function-uses-loop-variable: intentional closures in factory patterns
    "B027",  # empty-method-without-abstract-decorator: stub/interface patterns
    "B024",  # abstract-base-class-without-abstract-method: mixin patterns
    "S603",  # subprocess-without-shell-equals-true: handled in per-file-ignores
    "S607",  # start-process-with-partial-path: handled in per-file-ignores
    "S605",  # start-process-with-a-shell: handled in per-file-ignores
    "S602",  # subprocess-popen-with-shell: handled in per-file-ignores
    "F811",  # redefined-while-unused: backward-compat aliases and decorator wrappers
    "F402",  # import-shadowed-by-loop-var: intentional in dynamic import patterns
    "F601",  # multi-value-repeated-key-literal: config dict overrides
    "F722",  # forward-annotation-syntax-error: complex type annotations
    "E721",  # type-comparison: intentional isinstance vs type() checks
    "S102",  # exec-builtin: used in dynamic code generation
    "S103",  # bad-file-permissions: intentional in deployment scripts
    "S104",  # hardcoded-bind-all-interfaces: intentional in server configs
    "S113",  # request-without-timeout: handled by retry decorators
    "S314",  # suspicious-xml-element-tree: used for config parsing
    "S608",  # hardcoded-sql-expression: used in query builders
    "S701",  # jinja2-autoescape-false: templates are internal-only
    "S106",  # hardcoded-password-func-arg: false positives on config keys
    "B905",  # zip-without-explicit-strict: legacy patterns
    "UP035", # deprecated-import: maintaining backward compat
    "COM812", # missing-trailing-comma: conflicts with ruff-format (formatter handles commas)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S301", "S307", "B011", "B017", "E712", "F841"]  # Allow asserts and test-specific patterns
"scripts/**/*.py" = ["S603", "S607"]  # Allow subprocess in scripts
"ops_scripts/**/*.py" = ["S603", "S607", "F841", "F401", "F821", "F823"]  # Allow subprocess + lazy dynamic patterns
"tools/**/*.py" = ["B011", "E712", "F841", "F821", "F823"]  # Allow evidence runner + lazy dynamic patterns
"agentic_core/L6_system_learning/**/*.py" = ["E712", "F841", "F821", "F823"]  # Allow L6_system_learning lazy patterns
"agentic_core/**/*.py" = ["F841", "F821"]  # Allow pre-existing unused vars + undefined names in complex agents
"*.py" = ["F841"]  # Root-level scripts
"agentic_core/**/scripts/*.py" = ["S603", "S607"]  # Allow subprocess in agent scripts
"**/__init__.py" = ["F401"]  # Allow unused imports in __init__.py (re-exports)

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "archives/",
    "stubs/",
    "tests/"
]
