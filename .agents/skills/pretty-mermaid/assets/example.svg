<svg viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg" role="img"><title>Animated flow example</title><desc>A token moves from intake to outcome along a process line.</desc><style>@media (prefers-reduced-motion:reduce){.token{display:none}}</style><path id="route" d="M100 120 H700" fill="none" stroke="currentColor" stroke-width="4"/><circle class="token" r="10"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle><text x="100" y="90">Intake</text><text x="650" y="90">Outcome</text></svg>
