<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Walkthrough</title><style>body{font-family:Arial,sans-serif;margin:0;display:grid;grid-template-columns:2fr 1fr;min-height:100vh}#map{padding:2rem}#detail{padding:2rem;border-left:1px solid #ccc}.node{cursor:pointer}</style></head><body><section id="map"><svg viewBox="0 0 800 500" role="img" aria-label="Walkthrough map"><g class="node" tabindex="0" data-title="Start" data-body="Start here"><rect x="80" y="180" width="180" height="90" rx="16" fill="none" stroke="currentColor"/><text x="170" y="230" text-anchor="middle">Start</text></g></svg></section><aside id="detail"><h1>Start</h1><p>Start here</p></aside><script>const d=document.querySelector('#detail');document.querySelectorAll('.node').forEach(n=>{const a=()=>d.innerHTML='<h1>'+n.dataset.title+'</h1><p>'+n.dataset.body+'</p>';n.addEventListener('click',a);n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();a();}})});</script></body></html>
