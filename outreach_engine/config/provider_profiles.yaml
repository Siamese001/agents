provider_profile_registry_id: outreach_engine::provider_profiles::v1
app_id: outreach_engine
version: "1.2.0"
status: active

# outreach_engine model and provider routing SSOT.
# Models and reasoning parameters resolve exclusively through this registry.
model_pin_ownership:
  routing_ssot: outreach_engine/config/provider_profiles.yaml
  shared_catalog_role: capability_metadata_only
  environment_model_override_allowed: false
  receipt_identity_source: observed_provider_response

ide_argon4_routing_policy:
  interactive_ide_enabled: true
  marginal_api_cost_per_mtok_usd: 0.0
  context_window_tokens: 131072
  thinking_separation_guaranteed: true
  high_reasoning_roles:
    - executive_outreach_generator
    - recruiter_outreach_generator
    - company_brief_generation
  medium_reasoning_roles:
    - rubric_judge_panel
    - x1d_proof_judge_primary
    - x1d_proof_judge_secondary
    - handoff_judge
  external_api_retained_only_for:
    - headless_unattended_batch_ci
    - cross_family_x1d_dual_provider_proof_judging
  quality_preservation_gates:
    - QuestionEndingValidator
    - ExecutiveOutreachJudgePanel
    - sanitize_briefing_content

# Keyless headless Antigravity IDE CLI transport for Outreach proof and rubric judges.
# Env override: APPS_LIC_JUDGE_TRANSPORT=ide_cli|deterministic|external_api.
# Every live IDE judge call runs deny-all-tools and fails closed to BLOCKED with zero synthetic fallback.
ide_cli_judging:
  transport: ide_cli
  cli_env_var: AGY_CLI_BIN
  primary_judge_model: gemini-4-argon-medium
  second_judge_by_writer_maker:
    anthropic: gpt-oss-120b-medium
    openai: gemini-4-neon-medium
    google: gpt-oss-120b-medium
  quota_backup_primary_judge:
    - gemini-4-neon-medium
    - gemini-3.8-flash-high
  quota_backup_second_judge_by_writer_maker:
    anthropic:
      - gemini-4-neon-medium
      - gemini-3.8-flash-medium
    openai:
      - gpt-oss-120b-medium
      - gemini-3.8-flash-medium
    google:
      - gemini-4-neon-medium
  rubric_panel_judge_model: gemini-4-argon-medium
  rubric_panel_quota_backups:
    - gemini-4-neon-medium
    - gpt-oss-120b-medium
  reasoning_effort_by_profile:
    outreach_multi_touch_sequence: high
    outreach_single_draft: medium

profiles:
  executive_outreach_generator:
    profile_id: outreach_engine::provider::executive_outreach_generator::v2
    provider: anthropic
    provider_class: external_api
    model: claude-sonnet-5-5-high
    backup_provider: openai
    backup_model: gpt-5.6-luna
    reasoning_effort: low
    thinking_budget_tokens: 2048
    max_output_tokens: 4096
    advisory_only: false
    proof_eligible: false
    ide_internal_tier: argon4_high
    pin_owner: outreach_engine.generator.executive
    pin_review_after: "2026-11-07"
    description: "Peer-to-peer executive outreach draft synthesis with cross-family backup"

  recruiter_outreach_generator:
    profile_id: outreach_engine::provider::recruiter_outreach_generator::v2
    provider: anthropic
    provider_class: external_api
    model: claude-sonnet-5-5-high
    backup_provider: openai
    backup_model: gpt-5.6-luna
    reasoning_effort: low
    thinking_budget_tokens: 2048
    max_output_tokens: 4096
    advisory_only: false
    proof_eligible: false
    ide_internal_tier: argon4_high
    pin_owner: outreach_engine.generator.recruiter
    pin_review_after: "2026-11-07"
    description: "Scannable executive recruiter outreach synthesis with cross-family backup"

  rubric_judge_panel:
    profile_id: outreach_engine::provider::rubric_judge_panel::v1
    provider: anthropic
    provider_class: external_api
    model: claude-sonnet-5-5-medium
    backup_provider: google
    backup_model: gemini-3.8-flash
    reasoning_effort: low
    thinking_budget_tokens: 1024
    max_output_tokens: 2048
    advisory_only: true
    proof_eligible: false
    ide_internal_tier: argon4_medium
    pin_owner: outreach_engine.judges.panel
    pin_review_after: "2026-11-07"
    description: "Multi-lens executive outreach rubric evaluator right-sized to Sonnet 5.5 (Medium)"

  x1d_proof_judge_primary:
    profile_id: outreach_engine::provider::x1d_proof_judge_primary::v1
    provider: google_gemini
    provider_class: external_api
    model: gemini-3.8-flash
    reasoning_effort: low
    thinking_budget_tokens: 1024
    max_output_tokens: 4096
    advisory_only: false
    proof_eligible: true
    orthogonal_to_drafter_family: anthropic
    ide_internal_tier: argon4_medium
    pin_owner: outreach_engine.judges.x1d_primary
    pin_review_after: "2026-11-07"
    description: "Primary cross-family X1D proof judge (Gemini 3.8 Flash at low effort)"

  x1d_proof_judge_secondary:
    profile_id: outreach_engine::provider::x1d_proof_judge_secondary::v1
    provider: openai
    provider_class: external_api
    model: gpt-5.6-luna
    reasoning_effort: low
    thinking_budget_tokens: 1024
    max_output_tokens: 4096
    advisory_only: false
    proof_eligible: true
    orthogonal_to_drafter_family: anthropic
    ide_internal_tier: argon4_medium
    pin_owner: outreach_engine.judges.x1d_secondary
    pin_review_after: "2026-11-07"
    description: "Secondary cross-family X1D proof judge (GPT-5.6 Luna at low effort)"

  company_brief_generation:
    profile_id: outreach_engine::provider::company_brief_generation::v1
    provider: openai
    provider_class: external_api
    model: gpt-5.6-terra
    reasoning_effort: low
    thinking_budget_tokens: 2048
    max_output_tokens: 4096
    advisory_only: false
    proof_eligible: false
    ide_internal_tier: argon4_high
    pin_owner: outreach_engine.research.generation
    pin_review_after: "2026-11-07"
    description: "Company intelligence targeting brief generation"

  handoff_judge:
    profile_id: outreach_engine::provider::handoff_judge::v1
    provider: google
    provider_class: external_api
    model: gemini-3.8-flash
    reasoning_effort: low
    thinking_budget_tokens: 1024
    max_output_tokens: 2048
    advisory_only: false
    proof_eligible: true
    ide_internal_tier: argon4_medium
    pin_owner: outreach_engine.research.judge
    pin_review_after: "2026-11-07"
