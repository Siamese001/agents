# .pre-commit-config.yaml
#
# DESIGN PRINCIPLE: staged-file-only checks. No whole-repo scans.
# No always-run hooks without types/files scope. No warn-only gates.
#
# Antigravity Pre-Commit Pipeline:
#   T0a  trailing-whitespace          — deterministic, no Python startup
#   T0b  end-of-file-fixer            — deterministic, no Python startup
#   T0c  enforce LF line endings      — deterministic, no Python startup
#   T0d  check merge conflict markers — deterministic, no Python startup
#   T1   python syntax check          — fast syntax fail via py_compile
#   T2   ruff-format                  — auto-formatting before governance
#   T3   config-ssot-enforcement      — Single Source of Truth configuration check
#   T4   verify-commit-invariants     — Tier 1 pre-commit quality gate (tools/verify_commit.py)
#   T5   validate-turn-gates          — Mechanical pre-turn gate validator
#   T6   validate-implementation-plan — Staged implementation plan validator
#   T7   fast-governance-tests        — Fast regression test suite for core governance

fail_fast: true
default_language_version:
  python: python3.12

# Global exclude — applied to every hook. Individual hooks may extend this.
exclude: |
  (?x)^(
    .*\.debug\.log|
    .*/logs/.*|
    .*_sites\.txt|
    .tmp/.*|
    .tmp_.*sites\.txt|
    0[0-9]_[^/]*/.*|
    _capture_.*|
    _make_.*|
    _out_.*|
    _rebuild_.*|
    _run_.*|
    _selfcheck_.*|
    _temp_cmd.*|
    _typed_.*|
    _typed_emitted_.*|
    docs/store/.*|
    guardian_.*\.(txt|json)|
    pytestdebug\.log|
    runtime_state.*\.json|
    temp_[^/]*/.*|
    temp_complete_rules.*\.md|
    tmp.*
  )

repos:
  # ============================================================================
  # TIER 0: Whitespace & Line-Ending Normalization (deterministic, no churn)
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: "T0a: Trailing Whitespace"
        exclude: '.*\.md$'
      - id: end-of-file-fixer
        name: "T0b: End-of-File Fixer"
        exclude: '.*\.md$'
      - id: mixed-line-ending
        name: "T0c: Enforce LF Line Endings"
        args: [--fix=lf]
        exclude: '.*\.md$'
      - id: check-merge-conflict
        name: "T0d: Check Merge Conflict Markers"

  # ============================================================================
  # TIER 1: Syntax Gate (Fastest Fail — broken files never proceed)
  # ============================================================================
  - repo: local
    hooks:
      - id: python-syntax-check
        name: "T1: Python Syntax Validation"
        entry: python3 -m py_compile
        language: system
        types: [python]
        require_serial: true

  # ============================================================================
  # TIER 2: Ruff Format
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff-format
        name: "T2: Ruff Format"
        exclude: '.*\.md$'

  # ============================================================================
  # TIER 3-7: Native Antigravity Governance & Verification Gates
  # ============================================================================
  - repo: local
    hooks:
      # -- T3: Config SSOT Enforcement Gate ---------------------------------------
      - id: config-ssot-enforcement
        name: "T3: Config SSOT Enforcement"
        entry: python3 -m tools.config_ssot_agent check
        language: system
        pass_filenames: true
        always_run: false
        require_serial: true
        types: [python]

      # -- T4: Tier 1 Commit Invariants Gate ---------------------------------------
      - id: verify-commit-invariants
        name: "T4: Verify Commit Invariants"
        entry: python3 tools/verify_commit.py --staged
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      # -- T5: Mechanical Pre-Turn Gates -------------------------------------------
      - id: validate-turn-gates
        name: "T5: Validate Turn Gates"
        entry: python3 tools/validate_turn_gates.py --mode pre-turn
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      # -- T6: Staged Implementation Plan Validator --------------------------------
      - id: validate-implementation-plan
        name: "T6: Validate Implementation Plan"
        entry: python3 tools/validate_implementation_plan.py --staged
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      # -- T7: Fast Governance Test Suite ------------------------------------------
      - id: fast-governance-tests
        name: "T7: Fast Governance Test Suite"
        entry: pytest tests/test_turn_gates.py tests/test_implementation_plan_governance.py tests/test_hitl_governance_enforcement.py tests/test_model_neutral_naming.py tests/test_unified_agent_architecture.py --timeout=60 -q
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
