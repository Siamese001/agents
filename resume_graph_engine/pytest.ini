[pytest]
addopts = --timeout=180
pythonpath =
    src
    .
markers =
    gpu: requires local acceleration (MPS/Metal/CUDA) and pinned local model
    mps: requires Apple Silicon MPS hardware acceleration
    macbook: marks tests verifying local macOS / Apple Silicon runtime behavior
    integration: opt-in runtime integration tests
    slow: comparatively expensive deterministic tests
    unit: isolated unit tests
