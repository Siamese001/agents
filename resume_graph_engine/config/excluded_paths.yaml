# Excluded Paths Configuration
# SSOT for scanner and .gitignore exclusions
# Version: 1.0.0
# Last updated: 2026-04-05

version: "1.0.0"

# Build and cache directories
build_cache_dirs:
  - "__pycache__"
  - ".pytest_cache"
  - ".ruff_cache"
  - ".mypy_cache"
  - ".tox"
  - "node_modules"
  - "build"
  - "dist"
  - "_build"
  - ".cache"
  - ".tmp"
  - "temp"
  - "tmp"
  - ".eggs"

# Version control directories
version_control_dirs:
  - ".git"
  - ".svn"
  - ".hg"

# Virtual environment directories
virtual_env_dirs:
  - ".venv"
  - "venv"
  - "venv_stable"
  - "env"
  - ".env"
  - "Lib"
  - "site-packages"

# Coverage and test output directories
coverage_dirs:
  - "coverage_html"
  - "htmlcov"
  - ".test_artifacts"
  - "test_artifacts"
  # Note: 'reports' removed — docs/reports/ is needed and should not be blocked

# Archive and backup directories
archive_dirs:
  - "archives"
  - "archive"
  - "_archive"
  - "tools/archive"
  - "artifacts"
  - ".sovereign_healing_backup"
  - ".healing_backups"
  - ".backup"
  - ".gravity_state"

# IDE and editor directories
ide_dirs:
  - ".idea"
  - ".vscode"
  - ".DS_Store"

# Vendor/package directories (not our code)
vendor_dirs:
  - "google"
  - "gapic"
  - "pip"
  - "dist-info"
  - "licenses"
  - "src"  # Often used for vendored packages

# Data and log directories (content, not code)
data_dirs:
  - "data/cache"
  - "data/corpus"
  - "data/external"
  - "data/manifests"
  - "data/memory"
  - "data/monitoring"
  - "data/processed"
  - "data/prompt_governance"
  - "data/rag_seeds"
  - "data/snapshots"
  - "data/ssot_artifacts"
  - "data/store"
  - "artifacts/_legacy_adg_archives"
  - "artifacts/adg_clean"
  - "artifacts/reports/test_enforcement"
  # - "data/golden_state"  # Needed for testing and evaluation
  # - "docs"  # Now an enforced territory per territories.yaml
  - "docs/reference/_archive"
  - "docs/windsurf"  # Fetched doc mirror — regenerated by scripts/refresh_windsurf_docs.py
  - "logs"
  - "raw"
  - "shared"

# Special exclusions
special_dirs:
  - "_compat"  # Compatibility shims - re-exports only
  - ".hypothesis"  # Hypothesis test database

# Pre-commit specific exclusions
# These patterns are specific to pre-commit hooks and should be excluded
# from hook execution to prevent infinite loops and unnecessary processing
precommit_excludes:
  # Removed 2026-04-19 (C2 consolidation): all paths under /artifacts/ are
  # already gitignored, and pre-commit with --all-files respects .gitignore,
  # so these entries never matched anything. Verified: `git ls-files artifacts/`
  # returned empty at time of removal.
  #   - "artifacts/adg_ci_lane_gate_result.json"
  #   - "artifacts/healing/healing_events.jsonl"
  #   - "artifacts/bypass_audit.jsonl"
  #   - "artifacts/import_health/import_health_report.json"
  #   - "artifacts/governance/*"
  - "temp_[^/]*/.*"  # Temporary directories
  - "tmp.*"  # Generic temp files
  - "_temp_cmd.*"  # Temp command files
  - "_out_.*"  # Temp output files
  - "_typed_.*"  # Temp typed files
  - "_typed_emitted_.*"  # Temp typed emitted files
  - "_rebuild_.*"  # Temp rebuild files
  - "_selfcheck_.*"  # Temp selfcheck files
  - "_run_.*"  # Temp run files
  - "_capture_.*"  # Temp capture files
  - "_make_.*"  # Temp make files
  - ".tmp/.*"  # Hidden tmp directories
  - "runtime_state.*.json"  # Runtime state files
  - "temp_complete_rules.*.md"  # Temp rule files
  - "guardian_.*.(txt|json)"  # Guardian temporary files
  - ".*.debug.log"  # Debug logs
  - "pytestdebug.log"  # Pytest debug log
  - ".tmp_.*sites.txt"  # Temp sites files
  - ".*_sites.txt"  # Generic sites files
  - "0[0-9]_[^/]*/.*"  # Numbered temp directories
  # Removed 2026-04-19 (exclusion-ssot-consolidated-review-2026-04-19.md §3):
  #   - "core/.*"                       — directory does not exist
  #   - ".backup/guardian_tests/.*"     — redundant (.backup/ already excluded at category level)
  #   - "v15_d_evidence_.*.json"        — Wave 15 retired
  #   - "v15_p2_evidence_temp.json"     — Wave 15 retired
  #   - "v15_d_inventory_p4.json"       — Wave 15 retired
  - ".*/logs/.*"  # Log directories
  - "docs/store/.*"  # Docs store directory

# Windsurf runtime state (local-only, never committed)
windsurf_state_dirs:
  - ".codex/state"

# ============================================================================
# RUNTIME SCANNER EXCLUSIONS (mirror of Python frozensets in
# apps_rg/L0_routing/config/path_constants.py — validated by
# ops_scripts/ci/check_exclusion_consistency.py to prevent drift).
#
# These are deliberately separate from the .gitignore categories above because
# runtime Python scanners have different needs (e.g. they exclude .windsurf
# whereas git tracks most of it). Keep them in sync with path_constants.py.
# ============================================================================

# Mirrors path_constants.SOVEREIGN_EXCLUDED_FOLDERS
sovereign_excluded_folders:
  - "__pycache__"
  - ".git"
  - ".venv"
  - "node_modules"
  - ".pytest_cache"
  - ".mypy_cache"
  - ".ruff_cache"
  - "artifacts"
  - ".sovereign_healing_backup"
  - ".healing_backups"

# Mirrors path_constants.GLOBAL_EXCLUDED_DIRS
# NOTE: includes "docs/archive/windsurf/legacy-tree" — runtime scanners skip it entirely even though
# git tracks .codex/rules, docs/archive/windsurf/legacy-tree/plans, active governance scripts, etc. Review
# flagged as drift risk in docs/reports/exclusion-ssot-consolidated-review-2026-04-19.md §2.1.
global_excluded_dirs:
  - ".git"
  - ".github"
  - ".idea"
  - ".venv"
  - ".vscode"
  - "docs/archive/windsurf/legacy-tree"
  - "__pycache__"
  - ".cache"
  - ".mypy_cache"
  - ".pytest_cache"
  - ".ruff_cache"
  - ".tmp"
  - ".eggs"
  - "_build"
  - "archive"
  - "archives"
  - "env"
  - "node_modules"
  - "site-packages"
  - "venv"
  - "build"
  - "dist"
  - "htmlcov"
  - ".tox"
  - ".nox"
  - "eggs"
  - "temp"
  - "tmp"
  - "venv_stable"
  - "*.egg-info"

# Mirrors path_constants.DISCOVERY_EXCLUDED_TERRITORIES
discovery_excluded_territories:
  - "runtime_shared"
  - "legacy_code"
  - "legacy_engines"
  - "archives"
  - "stubs"
  - "examples"

# ============================================================================
# L2 CONSOLIDATION 2026-04-19 — .codeiumignore and its codeium_* keys RETIRED.
#
# Why: Windsurf indexing already honors .gitignore + hidden paths + node_modules
# by default (docs/windsurf/llms-full.txt:810-819). The only deltas we ever
# carried were **/*.db and **/*.pb (now moved into file_patterns above) plus
# a !artifacts/governance/session_state.json negation that was vestigial —
# per tests/unit/ops_scripts/hooks/windsurf/test_pre_mcp_gate.py:1695-1704
# the pre-mcp-gate explicitly REFUSES to consult that path now (stale
# fallback; Fix 2 regression guard). Indexing it had no remaining upside.
# Net: .codeiumignore file deleted, T6h gate retired, 1 fewer surface.
# ============================================================================

# File patterns to exclude (glob-style)
file_patterns:
  - "*.pyc*"  # Matches *.pyc and pytest-cache variants like foo.pyc.12345
  - "*.pyo"
  - "*.pyd"
  - "*.so"
  - "*.dll"
  - "*.egg-info"
  - ".coverage"
  - ".coverage.*"
  - "*.log"
  - "*.tmp"
  - "Thumbs.db"  # Windows thumbnail cache (file, not directory)
  - "*.sqlite"  # Local SQLite databases (runtime state, never committed)
  - "*_test/"  # Runtime test directories (never committed)
  - "runtime_adg/"  # Live ChromaDB vector store directories (regenerated at runtime, never committed)
  - "*.jsonl"  # JSON Lines runtime output files (drift timelines, trace logs — never committed)
  - "*.zip"  # Archives should stay local or in LFS-only flows
  - "*.gz"  # Compressed artifacts should stay local or in LFS-only flows
  - "*.pkl"  # Serialized local cache/models should not be committed
  - "repo_root.txt"  # Local diagnostic export; never commit
  - "*.db"  # Binary databases (L2 consolidation 2026-04-19; prior deliberately kept out, now unified)
  - "*.pb"  # Protobuf session blobs (L2 consolidation 2026-04-19; never committed)
  - ".keep-worktree"  # Worktree-per-chat opt-out marker (per-worktree local; never committed)
