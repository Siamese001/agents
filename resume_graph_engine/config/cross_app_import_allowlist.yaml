# Allowlist for `check_cross_app_imports.py` — sanctioned cross-app Python
# imports between apps_* packages.
#
# Each entry MUST carry:
#   - source:  importing module path (dot form, e.g. apps_eval.engines.scenario_runner)
#   - target:  imported package (e.g. apps_exec)
#   - reason:  non-empty justification (bare "" rejected)
#   - lazy:    true if import is inside a function body with ImportError fallback
#   - expires: ISO date; gate fails closed when entry is past expiry
#
# Plan: docs/archive/windsurf/legacy-tree/plans/apps-cross-app-precursors-c94c71.md Wave 6 (AG-1)
# Precedent: config/apps_spine_delegation_allowlist.yaml, config/config_references_allowlist.yaml

allowed_imports:
  # --------------------------------------------------------------------------
  # AG-1 known coupling — the one the plan explicitly called out.
  # --------------------------------------------------------------------------
  - source: apps_eval.engines.scenario_runner
    target: apps_exec
    reason: >-
      Eval harness subject — test-time by design. scenario_runner runs
      dry-run exec briefs as part of the eval scoring matrix. Imports are
      lazy (inside function body) with ImportError -> SKIP fallback, so
      runtime is benign even if apps_exec is not installed. AG-1 Option C
      chosen 2026-05-02: sanction the coupling rather than introduce a
      speculative EvalHarnessSubject protocol with a single implementor.
    lazy: true
    expires: '2026-11-02'

  # --------------------------------------------------------------------------
  # AG-1 baseline discoveries (2026-05-02) — 13 pre-existing peer-to-peer
  # imports surfaced when the gate was introduced. Each is documented here
  # so the gate turns green on main; future refactoring decisions consult
  # this list. Short expiries (6 months) force active review rather than
  # indefinite allowlist rot.
  # --------------------------------------------------------------------------

  # Cluster 1: apps_eval <-> apps_rg (narrative judge + anti-overfitting gates)
  - source: apps_eval.engines.narrative_judge_scorer
    target: apps_rg
    reason: >-
      NarrativeJudgeScorer imports AntiOverfittingConfig + gate_* functions
      and LengthBudget from apps_rg to grade resume narrative quality.
      Judge is apps_eval's but the measurement primitives are apps_rg's.
      Baseline at AG-1; consider hoisting shared primitives to apps_shared.
    lazy: false
    expires: '2026-11-02'
  - source: apps_rg.integrations.pool_first_selector
    target: apps_eval
    reason: >-
      Pool-first selector consumes JudgeVerdict/NarrativeJudgeScorer from
      apps_eval. Symmetric to the narrative_judge_scorer entry above —
      same judge-cluster coupling viewed from apps_rg side.
    lazy: false
    expires: '2026-11-02'
  - source: apps_rg.integrations.hops._ensemble_runner
    target: apps_eval
    reason: >-
      Ensemble runner consumes NarrativeJudgeScorer (same judge cluster).
    lazy: false
    expires: '2026-11-02'
  - source: apps_rg.integrations.hops._role_bullet_runner
    target: apps_eval
    reason: >-
      Role-bullet runner consumes NarrativeJudgeScorer (same judge cluster).
    lazy: false
    expires: '2026-11-02'

  # Cluster 2: apps_rg <-> apps_research (company-brief research facade)
  - source: apps_rg.integrations.company_research_loader
    target: apps_research
    reason: >-
      company_research_loader lazily imports CompanyBriefEngine from
      apps_research with ImportError -> None fallback. This is the sanctioned
      research-producer path for apps_rg. See ADR-080 (apps_research as
      cross-app research substrate).
    lazy: true
    expires: '2026-11-02'
  - source: apps_research.scripts.run_research
    target: apps_rg
    reason: >-
      Research CLI imports apps_rg types for output validation. Inverse
      direction of the company_research_loader coupling. Baseline at AG-1.
    lazy: false
    expires: '2026-11-02'

  # Cluster 3: apps_shared -> peer apps_* (adapters, facades, runtime drivers)
  - source: apps_shared.adapters.research_facade
    target: apps_rg
    reason: >-
      research_facade returns apps_rg.types.company_research.CompanyBrief
      because that is where the CompanyBrief type lives today. Imports are
      inside function bodies. Baseline at AG-1; reconsider when CompanyBrief
      moves to apps_shared.contracts.
    lazy: true
    expires: '2026-11-02'
  - source: apps_shared.types.golden_state_evaluator_types
    target: apps_rg
    reason: >-
      Golden-state evaluator types reference apps_rg resume types. Baseline
      at AG-1; candidate for moving the type to apps_shared.contracts if it
      stays shared.
    lazy: false
    expires: '2026-11-02'
  - source: apps_shared.proof.runtime_drivers.apps_underwriting_ai_driver
    target: apps_underwriting_ai
    reason: >-
      Runtime-proof driver must instantiate the real apps_underwriting_ai
      orchestrator — that is the point of the driver. Structural coupling
      by design; allowlisted rather than refactored.
    lazy: false
    expires: '2026-11-02'
