schema_version: model_registry.v2
registry_id: apps_rg::model_registry::v2
version: "2.0.0"
status: active

policy:
  environment_model_override_allowed: false
  aliases_allowed: false
  receipt_identity_source: observed_provider_response

providers:
  external_openai:
    profile_id: apps_rg::provider::external_openai::v1
    provider_profile: external_openai
    provider_class: external_api
    endpoint_env_var: APPS_RG_EXTERNAL_OPENAI_BASE_URL
    api_key_env_var: OPENAI_API_KEY
    capabilities:
      - text_generation
      - structured_json_generation
      - judge_grade_only
    default: false
    production_permitted: true

  external_claude:
    profile_id: apps_rg::provider::external_claude::v1
