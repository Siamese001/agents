model_tiers:
  frontier:
    description: High capability frontier reasoning and generation models
    recommended_effort: low
    max_cost_per_mtok: 20.0

  mid:
    description: Fast and economical generation and judging models
    recommended_effort: low
    max_cost_per_mtok: 5.0

  small:
    description: Ultra lightweight classification and routing models
    recommended_effort: none
    max_cost_per_mtok: 1.0

  deterministic:
    description: Zero LLM cost deterministic evaluators and rule engines
    recommended_effort: none
    max_cost_per_mtok: 0.0

