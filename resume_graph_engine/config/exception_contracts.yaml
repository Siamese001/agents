# config/exception_contracts.yaml
# --------------------------------
# Declared raise/catch symmetry contracts. Each row asserts: function
# ``raiser`` may raise ``exception_class`` under certain conditions, and at
# least one of its static callers (per ADG fan-in) MUST handle that exception
# — either by catching ``exception_class`` directly or by catching a parent
# class that subsumes it.
#
# Schema:
#   id                — short unique slug
#   description       — human-readable claim
#   raiser_module     — repo-relative .py path of the raising function
#   raiser_symbol     — dotted symbol path inside raiser_module (Class.method
#                        or bare function)
#   exception_class   — class name that is raised (last segment of dotted name)
#   parent_classes    — list of fallback parent class names that also count as
#                        handling the exception (e.g. Exception for broad catch,
#                        OSError, RuntimeError, ValueError)
#   require_n_handlers — minimum number of distinct caller functions that must
#                        handle the exception. Default: 1
#   severity          — error | warn
#   plan_id           — plan of record
#
# Enforcement: the gate resolves callers via ADG static fan-in on the raiser
# symbol (relation_type=calls and imports). It then AST-parses each caller's
# module to find the caller function and confirms at least one of the
# declared handler classes is caught — either in the caller body, or in any
# enclosing `try:` block.
#
# Warn severity is appropriate during seed phase. Promote to error once the
# contract has passed one green build and the invariant is stable.

contracts:

  - id: semcache-learn-runtime-error-handling
    description: >-
      SemanticCacheManager.learn may raise RuntimeError when the Redis or
      persistent store is unreachable. Every caller in ExecutionOrchestrator
      MUST handle RuntimeError (or a parent like Exception) — a swallow-free
      path here leaks infra failures to the L0 routing surface.
    raiser_module: apps_rg/L4_state/utils/memory/semantic_cache_manager.py
    raiser_symbol: SemanticCacheManager.learn
    exception_class: RuntimeError
    parent_classes: [Exception]
    require_n_handlers: 1
    severity: error  # Wave D: promoted — 3/6 callers covered, regression-safe
    plan_id: semcache-make-live-7a2d4b

  - id: create-embedding-client-disabled-error
    description: >-
      create_embedding_client may raise EmbeddingDisabledError
      (EMBEDDING_ENABLED=false) or EmbeddingSovereigntyViolationError (called
      from a non-allowlisted module). Callers MUST handle at least one of
      these — or RuntimeError (the shared parent) — otherwise a legitimate
      disabled-state yields an unhandled exception at L2 execution.
    raiser_module: apps_rg/embeddings/embedding_factory.py
    raiser_symbol: create_embedding_client
    exception_class: EmbeddingDisabledError
    parent_classes: [RuntimeError, Exception]
    require_n_handlers: 1
    severity: error  # Wave D: promoted — 2/3 callers covered, regression-safe
    plan_id: lazy-import-arch-defect-review

  - id: register-embedding-client-value-error
    description: >-
      ValueError propagates to callers of create_embedding_client from two
      paths: (1) directly from `create_embedding_client` itself when an
      unsupported provider is requested, and (2) transitively from
      `register_embedding_client` (the internal registry write — only ever
      invoked from inside `create_embedding_client`) on empty-name
      registration. Callers MUST handle ValueError so neither failure mode
      yields an unhandled exception at the embedding seam.
      W4 P4.2 (2026-04-30): all 3 callers (EmbeddingSovereignAgent,
      enhanced_rag_retrieval_cache, seed_pack_build_cli) now have precise
      ValueError handlers. Contract id retained for back-compat with the
      `lazy-import-arch-defect-review` plan; `raiser_symbol` corrected from
      private `register_embedding_client` (zero direct external callers) to
      public `create_embedding_client` (the actual caller-facing entry).
      Promoted warn→error per W4 P4.4 of plan adg-three-bucket-unified-c4f8e2.
    raiser_module: apps_rg/embeddings/embedding_factory.py
    raiser_symbol: create_embedding_client
    exception_class: ValueError
    parent_classes: [Exception]
    require_n_handlers: 1
    severity: error  # W4 P4.2 + P4.4: promoted — 3/3 callers covered, regression-safe
    plan_id: adg-three-bucket-unified-c4f8e2

  - id: semcache-initialize-critical-infra
    description: >-
      SemanticCacheManager._initialize raises CriticalInfrastructureError in
      STRICT mode when Redis/L2 is unreachable. _initialize is private and
      only invoked from _create_instance (the singleton factory); CIE
      propagates through get_instance() — the public entry point — so
      callers MUST wrap their get_instance() call in
      `except CriticalInfrastructureError`. A swallow-free path here surfaces
      infra unavailability instead of silently returning a partially-
      initialized singleton.
      W4 P4.3 (2026-04-30): all 6 callers (execution_orchestrator, route_gates,
      semantic_cache_mixin, meta_learning_storage_util, GlobalcacheStrategy,
      tiered_batch_util) now have the precise handler. Contract promoted
      warn→error per W4 P4.4 of plan adg-three-bucket-unified-c4f8e2.
    raiser_module: apps_rg/L4_state/utils/memory/semantic_cache_manager.py
    raiser_symbol: SemanticCacheManager.get_instance
    exception_class: CriticalInfrastructureError
    parent_classes: [Exception]
    require_n_handlers: 1
    severity: error  # W4 P4.4: promoted — 6/6 callers covered, regression-safe
    plan_id: adg-three-bucket-unified-c4f8e2
