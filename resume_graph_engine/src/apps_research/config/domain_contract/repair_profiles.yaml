# apps_research repair profile — apps-core-contract-rectification-a8f3c2 Phase 1.3
repair_profile_id: rp::apps_research::company_brief::v1
app_id: apps_research
version: 1.0.0
status: active
source_app_config_ref: apps_research/config/domain_contract/repair_profiles.yaml
created_at: '2026-05-03'

repair_scenarios:
  - scenario_id: retry_on_stale_source
    stage_id: retrieval
    trigger_condition: score_below_threshold:source_freshness:0.7
    recovery_action: retry_with_expanded_context:retrieval_sources
    rollback_target: retrieval
    healing_trigger: source_freshness
    escalation_path: mark_partial_pass
    max_attempts: 2
    priority: 1

  - scenario_id: retry_on_low_citation_coverage
    stage_id: synthesis
    trigger_condition: score_below_threshold:citation_coverage:0.8
    recovery_action: retry_with_expanded_context:hop_citations
    rollback_target: synthesis
    healing_trigger: citation_coverage
    escalation_path: escalate_to_hitl
    max_attempts: 2
    priority: 2

  - scenario_id: retry_on_unsupported_claim
    stage_id: synthesis
    trigger_condition: score_below_threshold:claim_support:0.9
    recovery_action: retry_with_backoff:2
    rollback_target: synthesis
    healing_trigger: claim_support
    escalation_path: escalate_to_hitl
    max_attempts: 2
    priority: 3

  - scenario_id: retry_on_stage_exception
    stage_id: any
    trigger_condition: stage_exception:RuntimeError
    recovery_action: retry_with_backoff:2
    rollback_target: none
    healing_trigger: ''
    escalation_path: abort_run
    max_attempts: 2
    priority: 4
