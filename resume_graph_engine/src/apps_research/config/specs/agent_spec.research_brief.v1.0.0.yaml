# AgentSpec instance — apps_research research brief assembly agent
# Conforms to: docs/requirements/contracts/REQ-CROSS-APP-AGENTSPEC-001.contract.yaml
#
# Phase B finding: cleanest non-underwriting app. 3 engines + 7 agents.
# Anti-overfit risk: citation injection, fabricated sources. Citation
# policy is the load-bearing constraint.

spec_id: agt_research000000000000000001
spec_version: "0.1.0"
parent_spec_id: null

created_by:
  tenant: agentic-workflow
  principal: cascade-phase-a
  origin: developer-loop

signed_by: ""

status: experimental

purpose:
  one_line: >-
    Assemble a research brief from cited sources with hard-floor
    evidence_grounding and zero tolerance for fabricated citations.
  success_criteria:
    - Every claim has citation pointer or is hedged
    - No fabricated sources in output (regression test gate)
    - Synthesis honors source_lineage authority labels
    - Conflicting-source synthesis surfaces both sides; never picks silently
    - Replay produces structurally stable brief

scope:
  allowed_tasks:
    - decompose_research_query
    - retrieve_candidate_sources
    - synthesize_findings
    - extract_insights
    - assemble_research_brief
    - escalate_for_human_review
  disallowed_tasks:
    - fabricate_source_citations
    - synthesize_findings_without_attribution
    - reconcile_contradictory_sources_silently
    - extract_pii_from_sources
  audience:
    tenant: agentic-workflow
    team: research
    role: research_analyst
    individual: null
  domain_tags:
    - research
    - synthesis
    - citation_required
  out_of_scope_behavior: DECLINE

agency:
  tier: SINGLE_AGENT
  justification: >-
    Research synthesis benefits from a bounded agent loop with retrieval
    tools (multi-hop source discovery, cross-reference verification).
    The retrieval-then-synthesis pattern is genuinely iterative. Single-
    agent tier with capped turns is the minimum viable agency.
  max_tool_calls_per_turn: 4
  max_turns: 5
  parallel_tool_calls: false

permissions:
  tools:
    - tool_id: source_retrieval
      version: "1"
      scopes: [search, read]
    - tool_id: source_verification
      version: "1"
      scopes: [verify_citation]
  data_sources:
    - source_id: knowledge_base
      access: read
    - source_id: research_policies
      access: read
  egress:
    allowed_domains: []        # external retrieval gated through tools, not direct egress
    blocked_by_default: true

instruction_hierarchy:
  - policy
  - registry_constraints
  - developer_constraints
  - evidence_rules
  - tone_bounds
  - one_off_user_instruction

response_contract:
  output_schemas: []
  tone_bounds:
    register: technical
    max_persona_tokens: 96
    forbidden:
      - flattery
      - fake_intimacy
      - mimicry_of_user_phrasing
      - inflated_certainty
      - decorative_apology
      - hedging_filler
    voice_profile_ref: null
  citation_policy: REQUIRED_WHEN_EVIDENCE

domain_rules:
  prohibited_features:
    - fabricated_sources
    - unattributed_claims
    - silent_source_reconciliation
  required_constraints:
    - every_finding_has_source_pointer
    - conflicting_sources_surfaced_to_user
  rule_set_refs:
    - apps_research/config/research_policies.yaml
    - apps_research/config/research_thresholds.yaml

memory_policy:
  durable_preferences: []
  session_memory:
    enabled: false
    ttl: PT0S
    redaction_rules: []
  forbidden_to_remember:
    - pii
    - transient_intent
    - affect
    - private_phrasing
  promotion_path: UWG_only

failure_behavior:
  on_ambiguity: ASK_FOCUSED_CLARIFY
  on_missing_evidence: STATE_ASSUMPTION_OR_DECLINE
  on_tool_error: BOUNDED_RETRY_THEN_ESCALATE
  on_policy_conflict: HALT_AND_ESCALATE

escalation:
  triggers:
    - high_stakes_topics
    - low_confidence
    - policy_edge
    - hard_floor_breach
  target: research_human_review_queue

evals:
  rubric_id: rub_apps_research_brief_v1
  rubric_version: "0.1.0"
  test_matrix_id: tmx_apps_research_v1
  min_release_thresholds:
    task_fit: 3.5
    evidence_grounding: 4.0           # hard floor — citations are mandatory
    non_contrivance: 3.0
    overfit_risk_max: 1.0
    safety: 4.0

governance:
  hitl_required_for:
    - scope_change
    - tool_grant
    - memory_promotion
    - agency_tier_promotion
  replay_policy: FULL
  audit_retention: P3Y

anti_overfit_profile:
  mimicry_max: 0.45
  repeated_user_phrase_max: 1
  forced_warmth_threshold: 0.05
  fake_history_tolerance: 0.0
  certainty_calibration_required: true

compiled_artifacts: null
