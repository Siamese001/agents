prefix_rules:
  - prefix: x2_
    gate_class: release_blocker
    source: generated_lane_x2
    description: "Active generated-lane X2 gates are product release blockers unless explicitly retired/debug."
  - prefix: x1d_
    gate_class: advisory
    source: judge_diagnostics
    description: "Judge diagnostics inform review; deterministic X2 remains release authority."
  - prefix: debug_
    gate_class: debug_metric
    source: diagnostics
    description: "Debug metrics never authorize product PASS."
