# apps_rg Gate Taxonomy
#
# Plan: apps_rg_lean_core_binding_a1b2c3 (Wave 8 — Gate Taxonomy Reset)
# Status: ACTIVE
#
# Gate classes:
# - release_blocker: a failing/missing gate must prevent product PASS/ALLOW.
# - advisory: a signal for routing/review/triage; it must not silently authorize PASS.
# - debug_metric: diagnostics, retired gates, and observability-only counters.

schema_version: apps_rg_gate_taxonomy_v1
app_id: apps_rg
task_class: resume_generation

classes:
  release_blocker:
    description: "Product safety or contract gate; failure blocks PASS/ALLOW."
    x3_effect: BLOCK_OR_REVIEW_NOT_PASS
  advisory:
    description: "Decision-support signal; failure may route to review but is not a product PASS gate."
    x3_effect: REVIEW_OR_WARN
  debug_metric:
    description: "Diagnostic or retired metric; never product authority."
    x3_effect: NONE

explicit_gates:
  # U0 → Exit assumption-ledger gates.
  - gate_id: U0-G-001
    gate_class: release_blocker
    stage: U0
    source: apps_rg.runtime.contracts.apps_rg_assumptions
