# Spec SSOT for unify_narrative (compile uses w7 shell + unify_narrative_pa._legacy_i0 at runtime).
# Marker: UNIFY_IBM_PROMPT_CORE_LAW_V3 — pa_core_law_v1 references; X2 gates in PRODUCT_SHAPE append only.
# Core PA law SSOT: apps_rg/prompt_assembly/pa_core_law_v1.yaml
# forbidden_slot_body_source: strategic_tailor_v1

schema_version: "prompt_template_v1"
template_id: "unify_position_narrative_v1"
version: "1.1"
allowed_stage: "L2_EXEC"
rewrite_intent: "UNIFY_NARRATIVE"
pa_core_law_ref: apps_rg/prompt_assembly/pa_core_law_v1.yaml
forbidden_slot_body_source: strategic_tailor_v1
execution_order: "AFTER_UNIFY_BULLET_FACT_CHECK"

purpose: |
  Write exactly one role-level CAPSTONE sentence for Unify Consulting after the Unify bullets are finalized.
  The sentence must align with the north-star arc: platform roadmap, core systems architecture, commercialization,
  reusable IP or platform services, consulting-firm delivery, and enterprise deployment — grounded strictly in C0 facts
  (unify_narrative_base_* anchor when present, plus bul_unify_*). It must NOT summarize or recap the six bullets.
  Uses accepted Unify bullets as the primary synthesis context for role-thesis construction while C0 remains proof/provenance.
  JD, target title/company, and briefing are targeting inputs only; they never appear in source_fact_ids.
  Complements bullets by concept overlap, never by copying labels, metrics, machinery stacks, or sentence structure.

sovereign_oath: |
  unify_narrative — role capstone only (not bullet recap). Governed by pa_truth_oath_v1, pa_proof_binding_v1,
  pa_targeting_only_v1 (pa_core_law_v1.yaml). Proof: SelectedRoleFactSet slice + C0 unify_narrative_base_* and bul_unify_* only.
  Companion finalized bullets: primary synthesis context after acceptance, not proof. One sentence; no cross-employer facts; no JD-as-proof in source_fact_ids.
  X2 enforcement: PRODUCT_SHAPE append at compile (not restated in runtime I0).

north_star_semantic_contract: |
  Preferred semantic shape (paraphrase allowed; must remain fact-grounded):
  Owned the platform roadmap, core systems architecture, and commercialization of [supported AI platform / Solution Accelerator]
  within [supported consulting firm / enterprise delivery context], converting bespoke delivery into reusable IP or scalable
  platform services deployed across supported enterprise contexts.
  Use Fortune 500 financial institutions, Solution Accelerator, or enterprise lines of business only when that exact substance
  exists in the base anchor or bullet facts in C0.
  FORBIDDEN MECHANICAL OPENERS (X2 fail-closed) — narrative MUST NOT begin with any of:
  led, successfully, also, built, delivered, designed, implemented, architected (case-insensitive).
  Replace with substantive openers that name the scope or outcome first, e.g. "Owned", "Drove",
  "Established", "Championed", "Productized", "Operationalized", "Anchored", "Scaled", "Originated",
  "Stewarded", or a noun-phrase opener like "Platform roadmap and commercialization of ..."

role_header_fields:
  company:
    source: "canonical_json.employment[exp_unify_001].employer"
    writable: false
    value: "Unify Consulting"
  location:
    source: "canonical_json.employment[exp_unify_001].location"
    writable: false
    value: "Boca Raton, FL"
  historical_title:
    source: "canonical_json.employment[exp_unify_001].title"
    writable: false
    value: "SVP Engineering, Agentic AI Platforms"
  dates:
    source: "canonical_json.employment[exp_unify_001].start_date / end_date"
    writable: false
    value: "2023-02 to present"

input_contract:
  required_fields:
    - name: finalized_unify_bullets
      schema: "{bullets: [{bullet_id, bullet_text, source_fact_id}]}"
      access_level: "READ_ONLY_ANTI_REPETITION"
      constraints:
        - "May not copy bullet_text"
        - "May not mirror bullet sentence structure"
        - "May not repeat bullet metrics without justification"
    - name: selected_fact_plan
      schema: "{exp_unify_001: {priority: 1, narrative_angle: string}}"
    - name: base_resume_json_ref
      value: "apps_rg/resume/base/amit_ayer_base_resume_v1.json"
    - name: base_section_hash
      description: "SHA256 of Unify employment section"
    - name: claim_ledger_from_bullets
      schema: "{claims: [{claim_text, source_fact_id, supported: bool, used_in_narrative: bool}]}"
    - name: narrative_intent
      allowed_values: ["COMPLEMENT_BULLETS", "ROLE_POSITIONING", "TRANSITION_NARRATIVE"]
      default: "COMPLEMENT_BULLETS"

required_runtime_dependency:
  dependency_lane: "unify_bullets"
  required_status: "ACCEPTED_FINALIZED"
  required_evidence:
    - "unify_bullets l2_output.json"
    - "six bullets with IDs bul_unify_001..006"
    - "unify_bullets product_quality_status PASS"
    - "unify_bullets deterministic X2 gates passed with no failed gates"
    - "unify_bullets x3_disposition is release-proof metadata; provider-quota judge blocks do not invalidate narrative dependency when product quality passed"
  fail_closed_rule: "If finalized bullets are missing, mocked, failed deterministic X2, or lack REAL_LLM product-quality evidence, do not produce a production narrative."

source_authority_hierarchy:
  proof_sources:
    - "canonical Unify facts"
    - "finalized Unify bullets, read-only and only after acceptance"
  targeting_context_only:
    - "target_title"
    - "target_company"
    - "jd_text"
    - "briefing"
  authority_rules:
    - "Candidate facts and finalized bullets decide what can be claimed."
    - "JD, title, company, and briefing decide the narrative angle, vocabulary, and priority, not proof."
    - "Do not introduce target-company facts as candidate experience."
    - "Finalized Unify bullets are synthesis context, not proof; synthesize principles and operating-model themes without mechanically repeating bullets; companion bullet source_fact_ids are not proof unless duplicated in unify_narrative SRFS allowlist."

prompt_engineering_hardening:
  role_and_objective: |
    Act as a senior executive resume editor writing the role narrative that sits above the Unify bullets.
    The narrative should make the Unify role feel like the candidate's strongest SVP Engineering proof point.
  private_process:
    - "Read the finalized bullets first and identify what they already prove."
    - "Choose one role-thesis angle that explains why the role mattered: platform mandate, operating model, commercialization, or governed delivery."
    - "Use JD/company/briefing themes only to choose emphasis."
    - "Draft one sentence, then self-repair for repetition, unsupported claims, JD mirroring, and executive readability."
    - "Prefer a clean executive sentence over a comma-packed mechanism list; the bullets carry detailed proof."
    - "Keep reasoning private. Output only the required JSON."
  sentence_shape_targets:
    - "One strategic through-line, not a six-bullet summary."
    - "Concrete enough to feel real, broad enough not to duplicate bullet detail."
    - "Strong current-role signal for SVP Engineering hiring screens."
    - "No first person, no candidate name, no em dash, no source tags."
    - "Do not reuse companion four-grams such as 'partner co-sell motions'; prefer partner-channel enablement or alliance distribution."

few_shot_patterns:
  positive:
    - id: unify_narrative_positive_north_star
      context: "C0 includes base role anchor and commercialization bullets; bullets carry metrics elsewhere."
      output_pattern: >
        Owned the platform roadmap, core systems architecture, and commercialization of a production-grade agentic AI platform
        at Unify Consulting, converting bespoke enterprise delivery into reusable platform services for regulated-enterprise adoption.
      why_it_works: "North-star capstone with a non-mechanical opener; no bullet labels, mechanism stacks, or default metrics."
    - id: unify_narrative_positive_alt_opener
      context: "Alternative non-mechanical opener form."
      output_pattern: >
        Drove the platform roadmap and commercialization of a governed agentic AI platform at Unify Consulting,
        turning bespoke enterprise delivery into reusable IP and scalable platform services for regulated-enterprise adoption.
      why_it_works: "Substantive opener (\"Drove\") not on the forbidden mechanical-opener list."
  negative:
    - id: unify_narrative_negative_mechanism_recap
      bad_output: >
        Shaped governed agentic AI platform delivery by weaving retrieval rigor, lifecycle governance, deterministic routing, GraphRAG, and policy gates.
      violation: "Mechanism recap from bullets instead of role-level capstone."
    - id: unify_narrative_negative_metric_recap
      bad_output: >
        Reduced lab-to-production from six months to three weeks while generating $22M and expanding margins by 20%.
      violation: "Repeats bullet metrics as the main point."
    - id: unify_narrative_negative_jd_as_proof
      bad_output: >
        Owned the agentic AI systems and LLMOps strategy required by the target company.
      violation: "JD/target framing presented as candidate proof."
    - id: unify_narrative_negative_forbidden_opener
      bad_output: >
        Led the platform roadmap and commercialization of a governed agentic AI platform at Unify Consulting.
      violation: "Begins with forbidden mechanical opener \"Led\" (X2 fail-closed via x2_unify_narrative_forbidden_opener)."
    - id: unify_narrative_negative_bullet_summary
      bad_output: "Built GraphRAG, deterministic routing, policy gates, Databricks integrations, API gateways, and $22M revenue while scaling from 8 to 28 specialists."
      violation: "Lists bullet topics and repeats protected metrics."
    - id: unify_narrative_negative_companion_fourgram_copy
      bad_output: "Owned Unify Consulting's governed agentic AI platform as a commercial engine, pairing partner co-sell motions with reusable IP."
      violation: "Copies the companion four-gram 'partner co-sell motions'; use partner-channel enablement or alliance distribution instead."
    - id: unify_narrative_negative_target_company_invention
      bad_output: "At the target company, led the global AI strategy required by the JD."
      violation: "Turns target context into candidate proof and names the wrong employer."

output_contract:
  format: "JSON"
  required_fields:
    - name: narrative_sentence
      type: "string"
      constraints:
        - "Exactly one sentence"
        - "Preferred 34–48 words; hard maximum 58 words"
        - "Hard maximum ~360 characters (retired short-char cap; word budget is authoritative)"
        - "No bullet characters (•, -, *)"
        - "No line breaks"
        - "No numbering"
      max_length: "~360 characters (word budget enforced downstream: <=58 words)"
      style: "Complementary to bullets without summarizing"
      anti_patterns:
        - "Summarizing bullet achievements"
        - "Repeating bullet metrics verbatim"
        - "Listing bullet topics"
        - "Copying bullet sentence structure"
        - "Introducing new metrics not in bullets or base"
    - name: claim_ledger
      type: "array"
      item_schema:
        claim_text: "string (non-empty material prose; minLength 1)"
        source_fact_ids: "array[string] (minItems 1; bul_unify_* and unify_narrative_base_* when in ALLOWED_SOURCE_FACT_IDS; exp_unify_* if allow-listed)"
        source_fact_id: "legacy singular alias only — normalize to source_fact_ids upstream"
        supported: "boolean"
        narrative_usage: "enum[direct, inferred, avoided]"
        repetition_risk: "enum[none, low, medium, high]"
    - name: anti_repetition_check
      type: "object"
      schema:
        bullet_metrics_repeated: "array[string] - metrics that appear in both bullets and narrative (should be empty or justified)"
        bullet_labels_repeated: "array[string] - labels/topics that overlap (should be minimal)"
        sentence_structure_similarity: "float 0.0-1.0 (should be < 0.3)"
        complement_score: "float 0.0-1.0 (should be > 0.7)"
        check_passed: "boolean"
    - name: gap_notes
      type: "array"
      description: "Unsupported narrative angles or gaps"
    - name: change_log
      type: "array"
      description: "Narrative construction decisions: {draft, revision, rationale}"
    - name: self_check
      type: "object"
      schema:
        exactly_one_sentence: "boolean (must be true)"
        no_bullet_list_format: "boolean (must be true)"
        no_new_metrics: "boolean (must be true)"
        no_repeated_bullet_metrics: "boolean (must be true)"
        complements_not_summarizes: "boolean (must be true)"
        no_cross_contamination: "boolean (must be true)"
        all_checks_passed: "boolean"

narrative_complement_guidance:
  purpose: |
    The narrative should state the role thesis and why the role mattered, not list achievements.
    Think of it as the executive arc the bullets prove, while the bullets carry what was delivered.
  angle_options:
    - "Strategic mandate: why the company invested in this function"
    - "Organizational scope: what this role touched and influenced"
    - "Capability building: what infrastructure or systems were established"
  avoid:
    - "Re-listing bullet achievements"
    - "Mentioning specific dollar amounts or percentages already in bullets"
    - "Echoing bullet sentence structure (Subject-Verb-Object achievement pattern)"
  example_anti_patterns:
    - bad: "Scaled the ML engineering organization from 8 to 28 engineers while generating $22M in revenue and expanding margins by 20%."
      reason: "Repeats all three metrics from bul_unify_006 verbatim"
    - bad: "• Architected cloud-native platforms • Built dependency graphs • Standardized AI lifecycle"
      reason: "Bullet list format forbidden, must be one sentence"
    - bad: "SVP Engineering responsible for agentic AI platforms, governance, and commercialization with proven results."
      reason: "Vague, sounds like JD buzzword stuffing, no specific positioning angle"
    - good: "Built the organization's first dedicated agentic AI practice from emerging technology experiments into a governed production platform serving multiple Fortune 500 programs."
      reason: "Positions the role's strategic mandate without repeating bullet metrics"

forbidden_patterns:
  - pattern: "bullet_list_output"
    check: "Output contains •, -, *, or numbered lists"
    action: "REJECT"
  - pattern: "multiple_sentences"
    check: "Output contains sentence-ending punctuation (.!?) more than once"
    action: "REJECT"
  - pattern: "repeated_bullet_metric"
    check: "Metric from bullets appears verbatim in narrative without justification"
    action: "FLAG_AND_REWRITE"
  - pattern: "copied_sentence_structure"
    check: "Narrative mirrors Subject-Verb-Object achievement pattern of bullets"
    action: "FLAG_AND_REWRITE"
  - pattern: "new_unsupported_metric"
    check: "Number in narrative not present in base or bullets"
    action: "REJECT"
  - pattern: "ibm_fact_contamination"
    check: "Any claim sourcing from non-Unify employment"
    action: "REJECT"
  - pattern: "cross_employment_summary"
    check: "Narrative references career arc beyond Unify"
    action: "REJECT"

metric_handling_rules:
  from_bullets:
    - metric: "$22M IP-led revenue"
      allowed_usage: "NONE, mention 'commercialization' or 'revenue generation' conceptually only"
    - metric: "20% gross margin expansion"
      allowed_usage: "NONE, mention 'margin improvement' or 'economics' conceptually only"
    - metric: "8 to 28 specialists"
      allowed_usage: "NONE, mention 'team building' or 'organization scaling' conceptually only"
    - metric: "6 months to 3 weeks"
      allowed_usage: "NONE, mention 'acceleration' or 'speed' conceptually only"
    - metric: "99.9% uptime"  # IBM metric
      allowed_usage: "FORBIDDEN, not a Unify fact"
    - metric: "40% TCO reduction"  # InsurTech metric
      allowed_usage: "FORBIDDEN, not a Unify fact"
  
  conceptual_references_allowed:
    - "commercialization (instead of $22M)"
    - "platform economics (instead of 20% margin)"
    - "organization scaling (instead of 8 to 28)"
    - "deployment acceleration (instead of 6mo to 3wk)"

validation_rules:
  pre_output:
    - assert: "output.narrative_sentence.count('.') == 1"
      error: "NOT_EXACTLY_ONE_SENTENCE"
      message: "Must be exactly one sentence"
    - assert: "len([w for w in output.narrative_sentence.split() if w]) <= 58"
      error: "WORD_BUDGET_EXCEEDED"
      message: "Must stay within 58 words (preferred 34-48)"
    - assert: "len(output.narrative_sentence) <= 360"
      error: "CHAR_BUDGET_EXCEEDED"
      message: "Must stay within 360 characters"
    - assert: "not any([c in output.narrative_sentence for c in ['•', '- ', '*', '1.', '2.', '3.']])"
      error: "BULLET_LIST_FORMAT"
      message: "Bullet list format forbidden"
    - assert: "all([all(str(s).startswith(('bul_unify_', 'unify_narrative_base_', 'exp_unify_')) for s in (b.get('source_fact_ids') or [])) for b in output.claim_ledger])"
      error: "CROSS_CONTAMINATION"
      message: "All claims must source from allow-listed Unify narrative resume facts only"
  post_output:
    - check: "anti_repetition_check.complement_score > 0.7"
    - check: "anti_repetition_check.sentence_structure_similarity < 0.3"
    - check: "anti_repetition_check.bullet_metrics_repeated is empty or all justified"

temperature_profile:
  range: "0.35 - 0.50"
  default: 0.40
  rationale: "Natural language variation for narrative flow while maintaining precision"
  sweep_validation: "Must pass at 0.35, 0.425, 0.50 with consistent single-sentence structure"

payload_scope:
  input_tokens_estimate: "~3,000 (includes finalized bullets as context)"
  output_tokens_estimate: "~300"
  context_window_required: "4K minimum"
  json_schema_strict: true

execution_context:
  runs_after: "unify_bullet_tailor_v1 fact check completion"
  input_dependency: "Finalized bullets from bullet pass (read-only)"
  anti_repetition_source: "Finalized bullets used solely to avoid repetition, not to copy"

# W5 — SSOT excerpt for contract tests (companion bullets context-only; SRFS slice is proof).
w5_proof_targeting_harmonization: |
  Proof: SelectedRoleFactSet facts for unify_narrative only; claim_ledger source_fact_ids must match this section's
  allowlist. Finalized Unify bullets: primary synthesis context only, not proof unless the same fact id is in the narrative slice.
  Targeting only: JD, briefing, target title, target company. Out-of-slice source_fact_ids fail X2. Omit unsupported claims;
  no invention of employers, metrics, partners, domains, or regulated claims beyond selected narrative facts.

metadata:
  produced_at: "2026-05-14"
  produced_by: "W2B STOP 6 - Unify Position Narrative"
  receipt_path: "artifacts/apps_rg/prompt_reset/w2b_outputs/stop_6_unify_narrative_receipt.json"
