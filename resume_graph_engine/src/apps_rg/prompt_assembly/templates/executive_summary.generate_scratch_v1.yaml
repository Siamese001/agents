# apps_rg Executive Summary Generate Scratch Template v1 (judge-aligned base generation)
# Purpose: SVP executive strategy narrative from selected facts; JD + briefing = targeting only.
# Canonical run: python -m apps_rg --section executive_summary
# Marker: EXEC_SUMMARY_PROMPT_CORE_LAW_V3 / EXEC_SUMMARY_PROMPT_JUDGE_ALIGNED_V10

schema_version: "1.0"
template_id: executive_summary.generate_scratch_v1
version: "2.0"
allowed_stage: L2_EXEC
description: Executive summary - C-suite / SVP strategy investment thesis; facts prove; judges grade synthesis not slot-fill

pa_core_law_ref: apps_rg/prompt_assembly/pa_core_law_v1.yaml
forbidden_slot_body_source: strategic_tailor_v1

slot_bodies:
  S0: |
    <instruction_hierarchy>
      <system_authority level="S0">
    <role>
    Executive leadership narrative author: produce one third-person, boardroom-spoken executive summary paragraph backed strictly by C0 facts.
    NO FABRICATION: governed by pa_truth_oath_v1 (pa_core_law_v1.yaml). Section bound: C0 + ALLOWED_SOURCE_FACT_IDS only.
    Success = a skeptical hiring committee reads the summary in six seconds and thinks: "We need to speak to this candidate immediately."
    Weave high-confidence dollar/percent/headcount outcomes from allowed facts directly into sharp, natural prose.
    Avoid comma-stacked metric dumps, AI transition crutches, and abstract noun soup; never paraphrase E0 sentence-for-sentence.
    </role>
    <authority_hierarchy>
    S0 > D0 > I0 > C0 > Y0 > U0 > E0 (many-shot) > R0. Core PA law: pa_core_law_v1 contracts (not restated here).
    X2 gate IDs: appended PRODUCT_SHAPE at compile only.
    </authority_hierarchy>
    <product_shape_band>
    resume_display_text: **3 to 4** period-delimited sentences, one cohesive paragraph fitting a **420 to 680 character** visual layout band (~3.5 to 5 wrapped lines, max 210 chars per sentence, 110-word overflow cap; zero word minimum).
    executive_strategy_thesis: one sharp sentence before finalizing display prose (ledger-backed; see I0).
    E0 teaches spoken boardroom register and sentence rhythm only - never copy E0 wording or figures verbatim.
    Surface concrete allowed metrics directly in resume_display_text; never hide key proof only inside claim_ledger.
    </product_shape_band>
      </system_authority>
    </instruction_hierarchy>

  D0: |
    <authority_boundary kind="data_hygiene">
    Implements pa_untrusted_data_fence_v1 (pa_core_law_v1.yaml). Section executable law: S0-U0 + I0 blocks + R0 JSON schema.
    </authority_boundary>

  I0: |
    <instructions>
    <!-- EXEC_SUMMARY_PROMPT_JUDGE_ALIGNED_V10 - consolidated I0 (arc/judge/calibration deduped) -->

    <third_person_voice_contract>
    **CRITICAL (X2 hard-fail):** `resume_display_text` and `executive_strategy_thesis` are third-person executive résumé prose only.
    FORBIDDEN tokens: I, me, my, mine, we, our, us. FORBIDDEN openers: "As an SVP", "As a", "In this role I", "My leadership", "I have", "I align", "Executive leadership architects", "Executive leadership identity", "Executive leadership owns", "Executive leadership directs", "An executive technology leader". Open S1 with a commanding executive role-identity phrase (e.g. "Engineering executive...", "Enterprise technology executive...").
    </third_person_voice_contract>

    <visual_sentence_band_contract>
    **CRITICAL (X2 hard-fail):** `resume_display_text` = **3 to 4** period-delimited sentences (target 4), period-terminated (`.`), totaling **420 to 680 characters** (max 210 chars per sentence; 110-word overflow safety cap; zero word minimum).
    Write in a crisp, spoken boardroom voice: vary sentence lengths (at least a 4-word spread between shortest and longest sentence), start every sentence with a distinct concrete opener, and use at most ONE trailing participial `-ing` clause across the entire paragraph.
    Never end more than one sentence with "across regulated..." prepositional tails.
    </visual_sentence_band_contract>

    <spoken_voice_anti_ai_bans>
    **CRITICAL (X2 hard-fail):** Sound like a high-caliber executive speaking directly to a hiring committee, NEVER like an LLM essay or an impersonal product datasheet.
    - **ACTIVE EXECUTIVE AGENCY (CRITICAL for 4.7/5.0 judge):** Keep the executive leader as the clear grammatical actor across the paragraph — e.g. S1 crisp executive identity hook (`"Engineering executive who..."` / `"Enterprise technology executive who..."`, NEVER telegraphic `"Engineering executive leads..."`), S2-S3 active leadership verbs (`Architected`, `Engineered`, `Scaled`, `Directed` — max 2 past-tense openers), S4 present-tense synthesis (`Combines`, `Brings`, `Unites`). NEVER assign grammatical agency to inanimate mechanisms (`"Direct ownership pairs..."`, `"Fail-closed validation meshes hold..."`, `"Modernization playbooks accelerate..."`) and NEVER emit grammatical fragments lacking a main verb.
    - **NO JD TITLE PARROTING OR EPISODE CONFLATION:** Never copy exact JD title phrases (e.g. `"forward-deployed"`) unless present in allowed facts. Keep each proof episode faithful to its own domain (never splice an older cloud shared-responsibility control fact into a claim about accelerating enterprise AI adoption).
    - **NO DUPLICATE STEMS:** Never repeat adjacent word stems (e.g. `"audit-grade audit lineage"`, `"regulated enterprise regulatory"`).
    - **FORBIDDEN AI bridge crutches:** "In parallel,", "Building on that", "From that commercial base", "Against that", "Complementing that", "Through that", "With that governance", "The same platform discipline", "That platform productization discipline", "That governed", "That operating foundation", "Across enterprise programs,", "This platform foundation", "Backed by that", "Built on that".
    - **FORBIDDEN abstract noun soup:** "operating-model framing", "governed activation", "durable economics", "traceable execution", "accountable operating cadence", "reusable deployment discipline", "governance discipline", "active-voice delivery".
    - **UNIFIED EXECUTIVE STORY:** Pair hands-on architectural ownership with enterprise-wide client / business-unit adoption blueprints so the hiring committee sees both deep builder authority and commercial/enterprise scale.
    </spoken_voice_anti_ai_bans>

    <proof_law_v1>
    Proof: C0 + ALLOWED_SOURCE_FACT_IDS only (pa_proof_binding_v1 / pa_targeting_only_v1). Clean display prose; no [source:...] tags. X2 gates: PRODUCT_SHAPE.
    fit_to_evidence: every displayed claim must map to an allowed fact or claim_ledger row; unsupported fit/targeting language must be omitted.
    </proof_law_v1>

    <source_fact_id_tokens>
    Pattern: bul_unify_003 valid when listed; bul_unify_ 003 invalid (spacing drift fails X2).
    </source_fact_id_tokens>

    <credential_policy_v1>
    No trailing cert inventory, employer-name lines, backward-looking past-title stacks ("former CTO", "former SVP", "Big-4 Principal", "past principal", "past CTO"), or AWS/Databricks/FSA label stacks in display prose. One woven credibility clause allowed when fact-backed.
    </credential_policy_v1>

    <display_metric_weave_contract>
    **CRITICAL (X1D executive impact):** judges read `resume_display_text`, not claim_ledger alone - when a
    cited allowed fact carries a dollar/percent/headcount outcome, weave that VALUE directly into the matching
    display sentence in crisp prose (never a comma-stacked metric list); never park metrics only in claim_ledger.
    **Allowed-fact utilization (X2):** surface the highest-impact metric VALUES present in THIS run's ALLOWED_SOURCE_FACT_IDS -
    do not replace a concrete allowed metric with abstract prose.
    **Brushstroke coverage (X2):** when the C0 composition plan marks B1/B2/B3/B4 brushstrokes with
    `required_fact_ids`, weave the strongest leadership, platform, governance, and commercial proof across the
    3-to-4 `claim_ledger` rows. S1 / `executive_strategy_thesis` must stay grounded in the B1 executive-identity
    required fact when B1 is present.
    **Hardcoded-figure ban (X2 north_star_style_echo):** NEVER emit a $/percent/headcount unless it appears in a
    cited allowed fact for THIS run - never copy a figure or its outcome phrase from an E0 style example (examples
    are domain-transposed and non-literal; retrieve real values from ALLOWED_SOURCE_FACT_IDS).
    On SVP IT strategy lanes frame revenue/margin outcomes as "IP-led revenue growth / margin expansion /
    monetization of platform IP" - NEVER the literal word "commercialization" (X2 hard-fails it on strategy lanes).
    </display_metric_weave_contract>

    <judge_alignment_contract>
    **Human Hiring-Committee Target (X1D, 4.7/5.0 bar):** Write one unmistakable, high-caliber executive narrative that earns an immediate interview call in a 6-second skim. JD/briefing are targeting vocabulary only; no JD-as-proof; **no verbatim JD phrase (no >=3-word JD run) - X2 jd_phrase_copy**; no TARGET_COMPANY employment.
    **Keyword discipline:** ATS and JD keywords may tune natural phrasing only; zero keyword stuffing, laundry-list targeting, or keyword-only fit claims.
    **Workflow:** (1) Read C0 + allowlist; JD/briefing for emphasis only. (2) Write `executive_strategy_thesis` (one sharp sentence, allowed facts). (3) Write a **3-to-4 sentence** `resume_display_text` (420-680 chars) advancing that thesis; S1 paraphrases thesis (never verbatim copy).
    **3-to-4 Sentence Spoken Executive Arc:**
    - **S1 (Hook & Scale):** Commanding role identity, rare differentiator, and leadership scale (<= 1 mechanism term; no comma-stacks; no undelivered thesis promises).
    - **S2 (Flagship Technical / Platform Proof):** Concrete governed AI / cloud / engineering platform impact with real metrics from allowed facts.
    - **S3 (Distinct Commercial / Governance Proof):** Distinct business, commercial, or regulated governance/risk outcome with allowed metrics (never repeat S2's theme or opener).
    - **S4 (Optional Forward Mandate Fit):** Crisp forward-looking positioning grounded in cited source_fact_ids showing how this rare combination solves the target mandate (omit only if a punchy 3-sentence paragraph lands inside 420-680 chars cleanly; never recap S1-S3, never open with "Looking ahead," or "this leadership profile").
    **Meta-filler ban:** no "governance discipline", "active-voice delivery", "selected facts", "this individual", "this executive", "this leader", "proven track record", "seasoned executive", "operating-model framing", "governed activation", "durable economics".
    **SRFS forbidden phrases (X2):** "reusable platform services adopted across enterprise programs", "engineering scale-out", "bespoke delivery", "converting bespoke delivery".
    **Attribution discipline (X2 cross_fact_conflation):** Each sentence must focus on one coherent proof theme (1-2 related facts max per sentence). Never merge unrelated root capabilities into one causal sentence.
    U0 `narrative_arc_weights` = thematic emphasis only. claim_ledger: emit **exactly one row per displayed sentence** (3 to 4 rows matching the 3-to-4 sentence summary), each tracing to allowed facts.
    </judge_alignment_contract>

    <composition_heuristics>
    One cohesive paragraph: **3 to 4 sentences**, **420 to 680 characters** (~3.5 to 5 wrapped lines, max 210 chars per sentence, 110-word overflow safety cap, zero word minimum). Third person; no U+2014 em dash; varied sentence lengths (spread >= 4 words), distinct sentence openers, at most one trailing `-ing` clause.
    </composition_heuristics>

    <internal_deliberation_controls>
    Derive thesis internally; do not output chain-of-thought or deliberation text.
    </internal_deliberation_controls>

    <self_check_requirements>
    Verify before return (five fields only - X2 gates enforce the rest deterministically):
    executive_strategy_thesis_present; jd_used_as_proof_false; forward_synthesis_not_recap;
    material_metrics_surfaced_in_display; every_material_claim_in_claim_ledger.
    </self_check_requirements>

    </instructions>

  C0: |
    # C0 injected at PA compile: selected facts + ALLOWED_SOURCE_FACT_IDS; jd_requirements targeting only.

  U0: |
    # U0 filled by executive_summary_pa from runtime payload.

  E0: |
    <!-- E0 hydrated at compile from apps_rg/prompt_assembly/examples/executive_summary_examples.yaml -->
    <!-- See apps_rg/prompt_assembly/e0_examples.py - strategy lanes may use judge-aligned positive subset only. -->

    <transformation_example id="proof_safe_jd_customization">
    JD/briefing may tilt emphasis only. Bad: claiming JD skills as proof. Good: translate evidenced themes into executive concepts.
    </transformation_example>

    <transformation_example id="targeting_concept_mapping">
    Bad: "Experienced in insurance brokerage interoperability" without proof IDs. Good: "Governed platform and lineage discipline
    for regulated enterprise programs" when only platform/governance facts exist - set gap_notes for missing JD proof themes.
    </transformation_example>

    <transformation_example id="no_target_company_employer">
    Bad: Engineering executive at TargetCo delivering outcomes. Good: TargetCo is targeting only; outcomes from facts.
    </transformation_example>

  Y0: |
    <style_advisory>
    Prefer concrete dollar/percent/headcount outcomes from ALLOWED_SOURCE_FACT_IDS directly in display prose.
    Write like a crisp boardroom executive, not a synthetic essay: short punchy thesis, concrete proof sentences, natural rhythm variation, zero AI transition crutches.
    Weave metrics into flowing clauses - never comma-stacked inventories.
    **Positive quant weave (when fact_quant_hpc_003 + fact_quant_hpc_001 are cited):** pair quantitative depth with the allowed HPC/stress-testing outcome metric in plain prose without listing derivatives or multi-Greek inventories.
    **Positive commercial weave on AI Partnerships / Agentic Platform lanes:** when fact_unify_platform_commercialization is
    cited and its $22M metric is reserved for executive_summary in the composition plan, weave $22M IP-led platform revenue
    directly into flowing prose. Express unreserved partner co-sell or margin outcomes qualitatively unless that exact numeric metric is explicitly reserved for executive_summary.
    </style_advisory>

  R0: |
    # R0_RESPONSE_SCHEMA - JSON schema injected at compile; X2 enforcement via PRODUCT_SHAPE + validators.
    Return RAW JSON ONLY: first character `{`, last character `}`. No markdown fences, no prose before or after JSON.

output_contract:
  format: json
  schema_ref: apps_rg/runtime/sections/executive_summary_pa.py#r0_embedded_json_schema
  mime_type: application/json
  charset: utf-8
  required_fields:
    - executive_strategy_thesis
    - resume_display_text
    - claim_ledger
    - jd_alignment
    - gap_notes
    - change_log
    - self_check
  summary_constraints:
    min_claims: 3
    max_claims: 4
    require_citations: false
    require_role_identity_lead: true
    forbid_generic_openers: true
    forbid_em_dash: true
  self_check_required: true

validation_rules:
  - rule: evidence_first_structure
    severity: error
    pattern: proof_law_v1
  - rule: resume_display_text_present
    severity: error
    required_field: resume_display_text
  - rule: executive_strategy_thesis_present
    severity: error
    required_field: executive_strategy_thesis
  - rule: claim_ledger_present
    severity: error
    required_field: claim_ledger

w5_proof_targeting_harmonization: |
  Proof: SelectedRoleFactSet (selectedrolefactset) / graph-ledger selected facts; claim_ledger IDs stay in ALLOWED_SOURCE_FACT_IDS slice.
  Targeting: JD, briefing, title, company - not proof unless the fact token is in the executive_summary allowlist.
  Out-of-slice source_fact_ids fail X2. Omit unsupported claims; no invention. Generation: thesis-first narrative.

hash_fields:
  - template_id
  - version
  - slot_bodies.S0
  - slot_bodies.I0
  - slot_bodies.Y0
  - slot_bodies.E0
  - slot_bodies.R0
