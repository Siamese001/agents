version: "1.0"
section: competencies
description: >
  Multishot examples for the competencies/skills section.
  Demonstrates correct gap-marking, cluster ordering, and evidence requirement.
  Display text is recruiter-facing and must not include inline source tags; proof binds
  via claim_ledger / source_fact_ids. All examples wrapped in XML tags per XML-structured prompt best practice.

examples:
  - id: competencies_pos_001
    category: positive
    section: competencies
    xml_wrapped: true
    before: null
    after: |
      AI/ML Engineering: PyTorch, TensorFlow, MLflow, Kubeflow
      Cloud Infrastructure: AWS (EKS, Lambda, S3), Terraform
      Data Engineering: Spark, Kafka, Airflow, dbt
      Leadership: Engineering org 40+ engineers, executive stakeholder mgmt
      [Gap: Databricks -- required by JD, no supporting evidence]
    claim_ledger_binding: >
      Clusters map to source_fact_ids fact_021, fact_018, fact_019, fact_025 respectively.
    annotation: >
      Clusters ordered by JD priority. Every listed skill grounded in
      candidate_facts via claim_ledger. JD-only skill (Databricks) correctly
      marked as gap rather than silently omitted or silently included.
    anti_ai_compliance:
      no_em_dash: true
      no_corporate_buzzwords: true

  - id: competencies_pos_002
    category: positive
    section: competencies
    xml_wrapped: true
    before: null
    after: |
      Technical Leadership: System design, architecture review, roadmap ownership
      Backend Engineering: Python, Go, gRPC, PostgreSQL
      [Gap: Rust -- required by JD, no supporting evidence]
      [Gap: Real-time systems -- required by JD, limited evidence]
    claim_ledger_binding: "source_fact_ids: fact_031, fact_022"
    annotation: >
      Multiple gap markers used correctly. Supported skills ledger-bound. No JD
      synonym substitution or inferred skills.
    anti_ai_compliance:
      no_em_dash: true
      no_corporate_buzzwords: true

  - id: competencies_neg_001
    category: negative
    section: competencies
    xml_wrapped: true
    before: null
    after: |
      AI/ML: Machine Learning, Deep Learning, Neural Networks, LLMs, Generative AI,
             Transformers, RAG, Vector DBs, Embeddings, Fine-tuning, RLHF
      Cloud: AWS, Azure, GCP, Kubernetes, Docker, Terraform, Helm
    annotation: >
      VIOLATION: Keyword stuffing -- too many unsupported terms listed without
      candidate_facts evidence. JD-required skills (Databricks, Kubeflow) silently
      included without evidence. No claim_ledger rows. No gap markers for absent skills.
    ai_giveaway_markers:
      - keyword_stuffing
      - missing_claim_ledger_binding
      - jd_only_skills_unlabeled

  - id: competencies_neg_002
    category: negative
    section: competencies
    xml_wrapped: true
    before: null
    after: |
      Core Competencies: Strategic thinking, thought leadership, change management,
                         stakeholder engagement, cross-functional collaboration,
                         driving meaningful impact, fostering innovation
    annotation: >
      VIOLATION: Pure corporate buzzword list with no concrete skills, no
      candidate_facts grounding, no ledger binding. "Thought leadership", "stakeholder
      engagement", "fostering innovation" are AI-signal phrases.
    ai_giveaway_markers:
      - corporate_buzzwords
      - missing_claim_ledger_binding
      - no_concrete_skills

  - id: competencies_repair_001
    category: repair
    section: competencies
    xml_wrapped: true
    before: |
      ENGINEERING & PLATFORM COMPETENCIES: Python, AWS, Leadership, Kubernetes, Terraform, Databricks,
              Azure Synapse, dbt, Spark, Flink, Iceberg, Delta Lake
    after: |
      Data Engineering: Spark, dbt, Kafka
      Cloud: AWS (S3, Glue, EMR), Terraform
      Languages: Python, SQL
      [Gap: Databricks -- required by JD, no candidate_facts entry]
      [Gap: Azure Synapse -- required by JD, no candidate_facts entry]
      [Gap: Apache Flink -- required by JD, no candidate_facts entry]
    claim_ledger_binding: "source_fact_ids: fact_019, fact_018, fact_022 per cluster"
    repair_actions:
      - Removed unsupported Databricks, Azure Synapse, Flink, Iceberg, Delta Lake
      - Grouped remaining skills by cluster
      - Added claim_ledger / source_fact_ids for each supported cluster
      - Added gap markers for all JD-required skills not in candidate_facts
    annotation: >
      Repair removes unsupported JD-derived terms, adds ledger binding, groups
      by cluster, and correctly marks genuine gaps.
    anti_ai_compliance:
      no_em_dash: true
      no_corporate_buzzwords: true
