# W5: Metadata filter profile — fact_vectors Chroma keys aligned with JD payload

schema_version: "2.0"
enabled: true

collection: fact_vectors

# NOTE (apps-rg-aig-remaining-lanes-closeout-d4e1f7 W1): `company` and `role` were removed as
# HARD Chroma `where` filters. fact_vectors holds the CANDIDATE's facts (tagged with the
# candidate's own employers/titles), while the query sources here are the TARGET job's
# company/role (jd_payload.target_company/target_role). A candidate fact from "Unify" can never
# `$eq` the target "AIG", so the hard filter matched zero chunks and zeroed the dense lane
# (REQUIRED_PROOF_ABSENT) for every profile-driven section. Per this file's own `score_separation`
# contract, JD↔candidate overlap is a SOFT `metadata_score` (see `_metadata_match_for_chunk`,
# observability-only), never a gate. Certification/year remain: they fire only when the JD
# supplies the value and match a candidate attribute to a JD requirement (meaningful, conditional).
filterable_fields:
  - field_name: certification
    chroma_metadata_key: certification
    display_name: Certification
    query_sources:
      - jd_payload.required_certifications
    match_type: exact_case_insensitive

  - field_name: year
    chroma_metadata_key: year
    display_name: Year/Date Range
    query_sources:
      - jd_payload.date_range
    match_type: range_overlap

rejected_source_classes:
  - company_research
  - rubrics
  - governance_docs
  - approved_examples
  - receipts
  - process_docs

score_separation:
  dense_score_field: confidence_score
  metadata_score_field: metadata_score
  combined_score_field: null
  evidence_item_fields:
    - confidence_score
    - metadata_score

claim_verification:
  deterministic_only: true
  supported_claim_types:
    - employer_match
    - certification_match
    - year_in_range
    - title_match
  unsupported_downgrade: WEAK_WITH_CAVEATS
