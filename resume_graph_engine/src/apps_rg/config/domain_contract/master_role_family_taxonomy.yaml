# apps_rg — canonical role-family taxonomy for adaptive fact selection (design / retrieval).
# SSOT count: twenty role families (thirteen legacy + seven senior-role W0.5b additions).
# Ledger JSON may reference legacy alias ids; normalize via role_family_id_aliases.

schema_version: "1"
description: >-
  Canonical role-family labels for JD → retrieval prioritization against the candidate
  fact ledger. JD and briefing texts are targeting inputs only; they never constitute proof.

notes:
  - >-
    Canonical employment facts remain in apps_rg/resume/base/amit_ayer_base_resume_v1.json.
    This taxonomy does not replace or overwrite that artifact.
  - >-
    Candidate ledger lives under artifacts/apps_rg/fact_inventory/ — facts are provisional
    until promoted through human confirmation and deterministic gates.
  - >-
    CRO-targeting uses composite projection profile CHIEF_REVENUE_OFFICER_COMPOSITE
    (apps_rg/config/domain_contract/composite_projection_profiles.yaml and arsenal ledger
    role_family_projection_profiles). There is intentionally no standalone CRO role family id.

