# Phase-1 section lane DAG — apps_rg whole-run parallel orchestration SSOT
# Section lanes are a separate modular execution surface and intentionally bypass
# whole-run R1A/R1B cache preflight.
# Plan: apps-rg-parallel-section-orchestration-f2a8c4 (W0.1)
#
# Dependency-ordered 2-stage schedule (executive_summary_v2 + Phase-0 frozen graph allocation):
#   wave 0 — graph-allocated independent sections
#            (competencies, slalom/unify/IBM/InsurTech bullets, executive_summary, headline)
#   wave 1 — narratives that consume finalized selected companion bullets
#
# Every lane `depends_on` must sit in a strictly earlier wave (assert_section_dag_wave_order).
schema_version: resume_sections_dag_v1
lanes:
  - id: competencies
    weight: light
    wave: 0
  - id: slalom_bullets
    weight: light
    wave: 0
  - id: unify_bullets
    weight: light
    wave: 0
  - id: ibm_bullets
    weight: light
    wave: 0
  - id: insurtech_bullets
    weight: light
    wave: 0
  - id: executive_summary
    weight: heavy
    wave: 0
  - id: headline
    weight: light
    wave: 0
  - id: slalom_narrative
    weight: light
    wave: 1
    depends_on:
      - slalom_bullets
  - id: unify_narrative
    weight: light
    wave: 1
    depends_on:
      - unify_bullets
  - id: ibm_narrative
    weight: light
    wave: 1
    depends_on:
      - ibm_bullets
  - id: insurtech_narrative
    weight: light
    wave: 1
    depends_on:
      - insurtech_bullets
waves:
  - id: 0
    description: graph-allocated independent sections (competencies, bullets, executive_summary, headline), parallel-eligible
    lanes: [competencies, slalom_bullets, unify_bullets, ibm_bullets, insurtech_bullets, executive_summary, headline]
    max_parallel_env: APPS_RG_PHASE1_MAX_PARALLEL
    default_max_parallel: 6
  - id: 1
    description: downstream narratives (after finalized companion bullets)
    lanes: [slalom_narrative, unify_narrative, ibm_narrative, insurtech_narrative]
    max_parallel: 4
