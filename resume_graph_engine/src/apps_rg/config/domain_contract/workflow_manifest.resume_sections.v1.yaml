# Phase-1 section lane DAG — apps_rg whole-run parallel orchestration SSOT
# Section lanes are a separate modular execution surface and intentionally bypass
# whole-run R1A/R1B cache preflight.
# Plan: apps-rg-parallel-section-orchestration-f2a8c4 (W0.1)
#
# Dependency-ordered redesign (2026-06-06):
#   wave 0 — upstream proof-bearing sections
#            (competencies, unify/IBM/InsurTech/EY bullets)
#   wave 1 — narratives that consume finalized selected bullets
#   wave 2 — executive_summary synthesizes finalized bullets + narratives + competencies
#   wave 3 — headline is final positioning; must not run before exec_summary finalizes
#
# Every lane `depends_on` must sit in a strictly earlier wave (assert_section_dag_wave_order).
schema_version: resume_sections_dag_v1
lanes:
  - id: competencies
    weight: light
    wave: 0
  - id: slalom_bullets
    weight: light
    wave: 0
  - id: unify_bullets
    weight: light
    wave: 0
  - id: ibm_bullets
    weight: light
    wave: 0
  - id: insurtech_bullets
    weight: light
    wave: 0
  - id: ey_bullets
    weight: light
    wave: 0
  - id: slalom_narrative
    weight: light
    wave: 1
    depends_on:
      - slalom_bullets
  - id: unify_narrative
    weight: light
    wave: 1
    depends_on:
      - unify_bullets
  - id: ibm_narrative
    weight: light
    wave: 1
    depends_on:
      - ibm_bullets
  - id: insurtech_narrative
    weight: light
    wave: 1
    depends_on:
      - insurtech_bullets
  - id: ey_narrative
    weight: light
    wave: 1
    depends_on:
      - ey_bullets
  - id: executive_summary
    weight: heavy
    wave: 2
    depends_on:
      - competencies
      - slalom_bullets
      - unify_bullets
      - ibm_bullets
      - insurtech_bullets
      - ey_bullets
      - slalom_narrative
      - unify_narrative
      - ibm_narrative
      - insurtech_narrative
      - ey_narrative
  - id: headline
    weight: light
    wave: 3
    depends_on:
      - executive_summary
      - competencies
      - slalom_bullets
      - unify_bullets
      - ibm_bullets
      - insurtech_bullets
      - ey_bullets
waves:
  - id: 0
    description: upstream proof-bearing sections (competencies + bullets), parallel-eligible
    lanes: [competencies, slalom_bullets, unify_bullets, ibm_bullets, insurtech_bullets, ey_bullets]
    max_parallel_env: APPS_RG_PHASE1_MAX_PARALLEL
    default_max_parallel: 6
  - id: 1
    # 2026-06-13: unpinned from max_parallel:1 (stale external model-era serialization). The
    # narratives are mutually independent (each depends only on its own bullets lane in
    # wave 0), so they parallelize safely now that run_lane_in_context is lock-free
    # (section_lane_executor.py). See memory apps-rg-parallel-orchestration-nonfunctional.
    description: downstream narratives (after finalized companion bullets)
    lanes: [slalom_narrative, unify_narrative, ibm_narrative, insurtech_narrative, ey_narrative]
    max_parallel: 5
  - id: 2
    description: heavy downstream synthesis (executive_summary) solo
    lanes: [executive_summary]
    max_parallel: 1
  - id: 3
    description: final positioning (headline) after exec_summary finalized
    lanes: [headline]
    max_parallel: 1
