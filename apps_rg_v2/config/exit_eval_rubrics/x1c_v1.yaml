gate: X1C
version: X1C@v1
composition: binary
metadata:
  description: >
    Safe to leave? Safety-boundary gate. All dimensions are binary
    sub-gates graded by code. Per H3, X1C hard sub-gates cannot be
    bypassed by break-glass.
dimensions:
  - name: sandbox_ok
    grader_class: code_based
    scale: [0, 1]
    weight: 1.0
    is_hard_gate: true
    threshold: 1.0
  - name: mutation_authorized
    grader_class: code_based
    scale: [0, 1]
    weight: 1.0
    is_hard_gate: true
    threshold: 1.0
  - name: env_clean
    grader_class: code_based
    scale: [0, 1]
    weight: 1.0
    is_hard_gate: true
    threshold: 1.0
  - name: no_prior_trial_leakage
    grader_class: code_based
    scale: [0, 1]
    weight: 1.0
    is_hard_gate: true
    threshold: 1.0
