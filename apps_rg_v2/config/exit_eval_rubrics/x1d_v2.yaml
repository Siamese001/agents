gate: X1D
version: X1D@v2
composition: weighted
aggregate_threshold: 0.80
metadata:
  description: >
    Answer good? v2 closes the X1D groundedness gap identified in the
    runtime-gate coverage review (2026-04-25).

    The exit-eval framework architecturally forbids model-graded hard
    sub-gates (gates.py: hard-gates must be CODE_BASED so they cannot
    fail-open on judge unavailability or abstain). Therefore, the veto
    enforcement for `groundedness` lives at the COMPOSITE layer via
    `partial_credit.veto_dimensions` in `config/judges/rubrics.yaml` —
    not as a per-rubric hard gate.

    Concrete v2 changes vs v1:
      - aggregate_threshold raised 0.75 -> 0.80 (tightens the
        composite gate so a single weak dim cannot pass).
      - groundedness weight raised 0.4 -> 0.5 (more leverage in the
        aggregate, reflecting Anthropic best-practice).
      - faithfulness weight 0.3 -> 0.3 (unchanged).
      - citation_support weight 0.3 -> 0.2 (slight decrease, since it
        is already a hard-fail at threshold 1.0 = code-graded resolvability).

    Veto-list enforcement (rubrics.yaml partial_credit.veto_dimensions)
    catches the case where groundedness alone falls below its dim
    threshold even if the weighted composite would have passed.
  superseded_versions:
    - X1D@v1
  changes_vs_v1:
    - aggregate_threshold 0.75 -> 0.80
    - weight rebalance: groundedness 0.4 -> 0.5; citation_support 0.3 -> 0.2
    - groundedness veto enforced via partial_credit.veto_dimensions, not
      via per-rubric is_hard_gate (framework forbids model-based hard gates)
dimensions:
  - name: groundedness
    grader_class: model_based
    scale: [0.0, 1.0]
    weight: 0.5
    is_hard_gate: false
    threshold: 0.80
    abstain_allowed: true
  - name: citation_support
    grader_class: code_based
    scale: [0, 1]
    weight: 0.2
    is_hard_gate: false
    threshold: 1.0
  - name: faithfulness
    grader_class: model_based
    scale: [0.0, 1.0]
    weight: 0.3
    is_hard_gate: false
    threshold: 0.70
    abstain_allowed: true
