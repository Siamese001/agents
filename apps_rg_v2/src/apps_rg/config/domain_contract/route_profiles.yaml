# apps_rg route profiles — canonical SSOT for deterministic fail-closed L0 routing.
# L0 selects from L1PlanContract facts only; profiles own apps_rg route policy.

- route_profile_id: arpf::apps_rg::resume_generation::r1a_exact_cache::v1
  app_id: apps_rg
  task_class: resume_generation
  version: "1.0.0"
  status: active
  selection_order: 10
  production_enabled: true
  test_only: false
  required_activation_flags: []
  conditions:
    task_spec.l0_terminal_route: R1A_EXACT_CACHE
  spine:
    canonical_route_id: R1A_EXACT_CACHE
    app_route_id: apps_rg.exact_cache_return
    route_family: R1A_EXACT_CACHE
    execution_form: TERMINAL
    l3_required: false
  personalization_default: false
  provider_model_requirement_ref: ""
  hitl_posture: none
  hitl_required_gate_ref: ""
  managed_workflow:
    workflow_ref: ""
    workflow_manifest_ref: ""
    workflow_registry_ref: ""
  budget_constraints:
    enforced: false
    profile_present: false
  graph_traverse:
    graph_expansion_allowed: false

