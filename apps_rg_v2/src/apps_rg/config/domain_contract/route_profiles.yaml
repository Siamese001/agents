- route_profile_id: arpf::apps_rg::resume_generation::scratch_managed::v1
  app_id: apps_rg
  task_class: resume_generation
  version: "1.0.0"
  status: active
  selection_order: 55
  production_enabled: false
  test_only: true
  required_activation_flags:
    - APPS_RG_ENABLE_MANAGED_WORKFLOW_L0
  conditions:
    generation_mode: generate_scratch
  spine:
    canonical_route_id: R3R4_MANAGED_WORKFLOW
    app_route_id: R3_GENERATIVE
    route_family: R3R4_MANAGED_WORKFLOW
    execution_form: MANAGED_WORKFLOW
    l3_required: true
  personalization_default: true
  provider_model_requirement_ref: apps_rg::provider_model::resume_generation::v1
  hitl_posture: advisory
  hitl_required_gate_ref: ""
  managed_workflow:
    workflow_ref: wfm::apps_rg::resume_generation::v1
    workflow_manifest_ref: wfm::apps_rg::resume_generation::v1
    workflow_registry_ref: apps_rg/config/route_registry.yaml
  budget_constraints:
    enforced: false
    profile_present: false
  graph_traverse:
    graph_expansion_allowed: true
    max_hops: 1
    max_nodes: 32
    max_edges: 64
    allowed_relation_types:
      - DERIVED_FROM
      - IMPLEMENTS
      - CONTRADICTS
      - SOURCE_VERSION
      - EVIDENCE
      - SUPPORTS
      - REQUIRES
      - RELATED_TO
    contradiction_scan_enabled: true
    supersession_scan_enabled: false
    graph_adapter_ref: apps_rg.integrations.c0_graph_adapter
    live_wiring_deferred: false
    wiring_gate: LIVE

- route_profile_id: arpf::apps_rg::resume_generation::full_resume_managed::v1
  app_id: apps_rg
  task_class: resume_generation
  version: "1.0.0"
  status: active
  selection_order: 60
  # This is the governed product path for a full-resume run.  Keep the
  # scratch route test-gated, but make the public product entrypoint select
  # this managed route without an operator-only environment flag.
  production_enabled: true
  test_only: false
  required_activation_flags: []
  conditions:
    merge_required_hint: true
  spine:
    canonical_route_id: R3R4_MANAGED_WORKFLOW
