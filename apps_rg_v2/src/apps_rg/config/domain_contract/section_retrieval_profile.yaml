# W4/W6: Section retrieval — fact_vectors only (C0 evidence-only)
# Golden dense C0 sections: executive_summary, unify_bullets, unify_narrative,
# ibm_bullets, ibm_narrative, competencies (+ optional headline smoke).

schema_version: "2.1"
enabled: true

ssot_collection_strategy:
  primary_collection: fact_vectors
  embedding_model_id: BAAI/bge-m3
  embedding_dim: 1024
  persist_path_env: CHROMA_PERSIST_DIR
  default_persist_relative: data/cache/chromadb

collection: fact_vectors

fact_vectors_constraints:
  collection_name: fact_vectors
  allowed_source_classes_only:
    - candidate_profile
    - project_evidence

section_id_aliases:
  professional_summary: executive_summary

global_constraints:
  max_total_evidence_items: 40
  max_sections_to_query: 8
  max_query_budget_ms: 12000

source_authority_defaults:
  candidate_facts_as_proof: false
  candidate_fact_lineage_allowed: true
  graph_as_claim_proof: false
  graph_as_routing_support: true
  graph_claim_proof_allowed_only_when_fact_bound: true
  jd_as_proof_allowed: false
  briefing_as_proof_allowed: false
  companion_context_authority: false

# Phase 2 sparse/exact lane — mandatory for apps_rg when APPS_RG_C0_DENSE_SPARSE_MANDATORY=1 (default).
sparse_lane_defaults:
  sparse_enabled: true
  # Keep the candidate fan-out aligned with the retrieval evaluation gate.
  # Visible resume-section limits are applied later by the graph selector.
  sparse_top_k: 10
  sparse_lane_id: ""
  sparse_collection_ref: fact_vectors
  sparse_index_ref: fact_vectors
  lexical_query_fields: []
  exact_match_fields: []
  dense_sparse_merge_policy: rrf
  sparse_unavailable_behavior: fail_closed
  sparse_empty_behavior: receipt_empty

sections:
  - retrieval_profile_id: apps_rg.headline.c0_profile
    section_id: headline
    display_name: Headline
    sparse_enabled: true
    sparse_lane_id: apps_rg.headline.sparse
    sparse_collection_ref: fact_vectors
    lexical_query_fields:
      - resume_payload.headline
      - jd_payload.jd_text
    exact_match_fields:
      - jd_payload.jd_text
    dense_top_k: 10
    max_k: 10
    support_target: high
    allowed_collections: [fact_vectors]
    required_metadata_filters:
      app: apps_rg
    optional_metadata_filters: {}
    freshness_profile: default
    authority_classes_allowed: [PRIMARY, SUPPORTING, REFERENCE]
    graph_expansion_allowed: true
    source_authority:
      candidate_facts_as_proof: false
      candidate_fact_lineage_allowed: true
      graph_as_claim_proof: false
      graph_as_routing_support: true
      graph_claim_proof_allowed_only_when_fact_bound: true
      jd_as_proof_allowed: false
      briefing_as_proof_allowed: false
      companion_context_authority: false
    headline_positioning_bundle_consumption: required
    graph_expansion_mode: headline_positioning_bundle_only
    fallback_policy: use_fallback_queries_if_query_fields_empty
    expected_evidence_strata: [CANONICAL]
    source_class_allowlist: [candidate_profile]
    query_fields:
      - resume_payload.headline
      - jd_payload.jd_text
    fallback_queries:
      - "SMOKE_C0_HEADLINE_ANCHOR principal product leader measurable revenue"

