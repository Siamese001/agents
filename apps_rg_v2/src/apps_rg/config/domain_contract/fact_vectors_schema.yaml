# SSOT: fact_vectors collection (apps_rg C0 dense lane)
# Embeddings MUST match tools.ingestion.chroma_ingest_pipeline (BGE-M3, 1024).

schema_version: "2.1"
collection_name: fact_vectors
description: Candidate-owned fact embeddings for apps_rg resume_generation (separate from process_docs)

allowed_source_classes:
  - candidate_profile
  - project_evidence

rejected_source_classes:
  - rubrics
  - governance_docs
  - approved_examples
  - receipts
  - company_research
  - process_docs
  - prior_outputs

ssot:
  persist_path_env: CHROMA_PERSIST_DIR
  default_persist_relative: data/cache/chromadb
  primary_collection: fact_vectors

embedding:
  model_id: BAAI/bge-m3
  dimensions: 1024

metadata_schema:
  app:
    type: string
    required: true
    allowed_values: [apps_rg]

  source_class:
    type: string
    required: true
    allowed_values: [candidate_profile, project_evidence]

  source_document_id:
    type: string
    required: true

  source_version_hash:
    type: string
    required: true

  ingestion_timestamp:
    type: string
    format: iso8601
    required: true

  chunk_id:
    type: string
    required: false
    notes: Optional duplicate of Chroma id for cross-refs

  company:
    type: string
    required: false
    notes: Employer / client for filtering (maps from JD target_company)

  role:
    type: string
    required: false
    notes: Role/title for filtering (maps from JD target_role)

  section_targets:
    type: string
    required: false
    notes: Comma-separated section_ids this chunk supports

  section_type:
    type: string
    required: false

  skills_mentioned:
    type: string
    required: false
    notes: JSON-encoded list stored as scalar for Chroma

  citation_anchor:
    type: string
    required: false

  chunk_digest:
    type: string
    required: false

  authority_class:
    type: string
    required: false
    allowed_values: [PRIMARY, SUPPORTING, REFERENCE, UNKNOWN]

  tier:
    type: string
    required: true
    allowed_values: [seed, learned]
    notes: Seed rows come from bootstrap/canonical candidate facts; learned rows are promoted from staging.

  candidate_fact_id:
    type: string
    required: false
    notes: Runtime C0.2 atom identifier stamped on write-back candidates.

  confidence:
    type: string
    required: false
    notes: Candidate-fact confidence copied from the source atom.

  proof_status:
    type: string
    required: false
    notes: Proof eligibility copied from the source atom.

  source_span_ref:
    type: string
    required: false
    notes: Pointer to the source span used to ground the atom.

  source_type:
    type: string
    required: false
    notes: Source taxonomy used by the staging-to-live promotion verifier.

  write_back_operation:
    type: string
    required: false
    allowed_values: [extract, fuse, enrich]
    notes: Grounded transform operation allowed into fact_vectors.

  promoted_at_utc:
    type: string
    format: iso8601
    required: false
    notes: UTC timestamp set when a staged learned row is promoted to live fact_vectors.

  promotion_run_id:
    type: string
    required: false
    notes: Promotion batch identifier stamped with promoted learned rows.

  run_id:
    type: string
    required: false
    notes: Runtime run identifier stamped on staged learned rows before X3-gated promotion.

  staged_at_utc:
    type: string
    format: iso8601
    required: false
    notes: UTC timestamp set when a candidate row lands in fact_vectors_staging.

  promotion_hold_reason:
    type: string
    required: false
    notes: Operator-visible reason a staged row remained held instead of promoted.

  x3_code:
    type: string
    required: false
    notes: X3 disposition code consulted by deferred promotion.

  embedding_model_id:
    type: string
    required: false

  embedding_dim:
    type: integer
    required: false

  freshness_status:
    type: string
    required: false
    allowed_values: [FRESH, STALE, EXPIRED, UNKNOWN]

  invalid_for_normative_use:
    type: string
    required: false

  certification:
    type: string
    required: false

  year:
    type: string
    required: false

chunking:
  max_tokens: 512
  overlap_tokens: 50
