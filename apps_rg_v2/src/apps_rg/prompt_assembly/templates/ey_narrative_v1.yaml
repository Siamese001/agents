template_id: ey_narrative_v1
section_id: ey_narrative
purpose: >
  EY experience is consolidated into Early Career/Foundation with 0 standalone narrative
  sentences (empty narrative sentence). Standalone LLM generation for EY narrative is
  disabled.
methodology_contract:
  role: CONSOLIDATED_EARLY_CAREER
  finalized_bullets_are_primary_synthesis_context: false
  proof_authority: active_proof_pool_and_claim_ledger_only
  thesis_rule: >
    EY experience is consolidated into Early Career foundation; no standalone narrative sentence.
  anti_patterns:
    - "standalone EY narrative generation"
    - "three-bullet recap"
    - "comma-packed list of bullet topics"
    - "new first-principles graph traversal in narrative"
    - "JD or briefing used as claim evidence"
output_contract:
  format: json_object
  required_keys:
    - narrative_sentence
    - claim_ledger
    - jd_alignment
proof_contract:
  source_fact_ids: optional
  bullet_dependency: bul_ey
  targeting_only: true
  jd_used_as_proof: false
  retries_cannot_repair_missing_upstream_evidence: true
