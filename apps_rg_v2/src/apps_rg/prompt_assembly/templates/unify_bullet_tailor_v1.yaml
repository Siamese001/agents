# Spec SSOT for unify_bullets (compile uses w7 shell + unify_bullets_pa._legacy_i0 at runtime).
# Marker: UNIFY_IBM_PROMPT_CORE_LAW_V3 — shared w7 shell cites pa_core_law_v1; X2 gates in PRODUCT_SHAPE append only.
# Core PA law SSOT: apps_rg/prompt_assembly/pa_core_law_v1.yaml
# forbidden_slot_body_source: strategic_tailor_v1 (full slot bodies — not loaded for unify_bullets compile)

schema_version: "prompt_template_v1"
template_id: "unify_bullet_tailor_v1"
version: "1.1"
allowed_stage: "L2_EXEC"
rewrite_intent: "UNIFY_BULLET"
pa_core_law_ref: apps_rg/prompt_assembly/pa_core_law_v1.yaml
forbidden_slot_body_source: strategic_tailor_v1

purpose: |
  Compose six Unify Consulting employment bullets for the target role using augmented_skills_graph proof
  (C0.3-bound skills + ledger fact atoms) as the authenticity layer. JD, briefing, title, and company shape
  emphasis and ordering only — never proof. Each PROVIDER_MODEL path outputs a full six-bullet variant; Claude pool selector
  starts with two paths and expands to four only if slot coverage or min score fails. No narrative text. No unsupported claims. No JD or briefing copying.
  No ATS keyword stuffing. This lane must run before unify_position_narrative_v1.

sovereign_oath: |
  UNIFY BULLETS ONLY — governed by pa_truth_oath_v1, pa_proof_binding_v1, pa_targeting_only_v1 (pa_core_law_v1.yaml).
  bul_unify_001..006 / exp_unify_001 slice only; no cross-employer contamination; bullets only (no narrative).
  Proof: GRAPH_BULLET_EVIDENCE_PACK + ALLOWED_SOURCE_FACT_IDS; C0.3-bound skill rows guide vocabulary when fact-linked.
  Ledger claim_text is archive_reference_only — not a copy source for bullet_text. No base-resume bullet hydration.
  Preserve locked metrics on protected bullets; SRFS allowlist in C0. Each bul_unify_* bullet must carry an
  approved metric_outcome_id from its slot bundle, surface the selected metric in bullet_text, and record the
  same id in change_log.metric_outcome_ids[]. Runtime compile I0: unify_bullets_pa._legacy_i0; X2 gates via
  PRODUCT_SHAPE append only. Out-of-slice source_fact_ids fail deterministic X2 SRFS gates; omit unsupported
  claims rather than generalizing from JD.

composition_rules:
  forbid_verbatim_claim_text: true
  require_skill_id_trace_in_change_log: true
  max_consecutive_words_from_archive_reference: 7

role_header_fields:
  company:
    source: "canonical_json.employment[exp_unify_001].employer"
    writable: false
    value: "Unify Consulting"
  location:
    source: "canonical_json.employment[exp_unify_001].location"
    writable: false
    value: "Boca Raton, FL"
  historical_title:
    source: "canonical_json.employment[exp_unify_001].title"
    writable: false
    value: "SVP Engineering, Agentic AI Platforms"
  dates:
    source: "canonical_json.employment[exp_unify_001].start_date / end_date"
    writable: false
    value: "2023-02 to present"

input_contract:
  required_fields:
    - name: selected_fact_plan
      schema: "{exp_unify_001: {priority: 1, allowed_bullets: [bul_unify_001..006], metrics: [...]}}"
    - name: base_resume_json_ref
      value: "apps_rg/resume/base/amit_ayer_base_resume_v1.json"
    - name: base_section_hash
      description: "SHA256 of Unify employment section for integrity"
    - name: claim_ledger
      schema: "{claims: [{claim_text, source_fact_id, supported: bool}]}"
    - name: jd_alignment
      schema: "{alignment_score, matched_terms, gap_terms}"
output_contract:
  format: "JSON"
  required_fields:
    - name: bullets
      type: "array"
      min_items: 6
      max_items: 6
      item_schema:
        bullet_id: "string (must map to bul_unify_001..006)"
        bullet_text: "string"
        has_metric: "boolean"
        metric_raw: "string or null"
        source_fact_ids: "array[string]"
    - name: claim_ledger
      type: "array"
      item_schema:
        claim_text: "string"
        source_fact_id: "string (must be bul_unify_*)"
        supported: "boolean"
    - name: gap_notes
      type: "array"
      description: "List of unsupported JD requirements or gaps"
    - name: change_log
      type: "array"
      description: "Per-bullet change tracking: {bullet_id, original_summary, change_type, rationale, metric_outcome_ids}"
    - name: self_check
      type: "object"
      schema:
        bullet_count_valid: "boolean (must be true)"
        no_narrative_text: "boolean (must be true)"
        no_cross_contamination: "boolean (must be true)"
        no_em_dash: "boolean (must be true)"
        no_excessive_jd_copying: "boolean (must be true)"
        metrics_preserved: "boolean (must be true)"
        all_checks_passed: "boolean"

rewrite_rules:
  pool_selection:
    sc_paths: 2
    max_sc_paths: 4
    adaptive_expansion: "expand_to_4_only_if_slot_coverage_or_min_score_fails"
    final_bullet_count: 6
    selector: "claude_pool_top_n_pass"
    min_selection_score: 0.72
  bullet_specific_guidance:
    bul_unify_001:
      content: "Agentic AI platform architecture — one outcome spine (regulated enterprise platform delivery)"
      key_terms: ["governed agentic AI platform", "regulated enterprise workflows", "production-grade platform"]
      mechanism_stack_cap: "At most ONE bullet may list dense mechanism vocabulary (routing, orchestration, GraphRAG, sandbox, policy gates, traces). Prefer this bullet for that stack OR distribute outcomes across bullets without comma-stacked machinery."
    bul_unify_002:
      content: "Dependency graph intelligence"
      key_terms: ["AST analysis", "legacy system analysis", "refactor risk"]
    bul_unify_003:
      content: "Governed runtime reliability"
      key_terms: ["retrieval quality", "context assembly", "evaluation gates", "telemetry", "rollback controls"]
    bul_unify_004:
      content: "AI systems lifecycle standardization"
      key_terms: ["lab-to-production", "cycle time reduction", "6 months to 3 weeks"]
      metric_anchor: "six months to three weeks must stay on this bullet"
    bul_unify_005:
      content: "Distributed ecosystem engineering"
      key_terms: ["AWS", "Databricks", "microservices", "API gateways"]
    bul_unify_006:
      content: "Platform commercialization and engineering leadership"
      key_terms: ["$22M IP-led revenue", "20% gross margin", "8 to 28 specialists"]
      protected_reason: "Contains compound business metrics; must not be split or diluted"

metric_preservation_rules:
  - metric: "6 months to 3 weeks"
    bullet: "bul_unify_004"
    preservation: "EXACT_OR_EQUIVALENT"
    equivalent_allowed: ["reduced cycle time from six months to three weeks", "cut deployment cycles by ~85%"]
  - metric: "$22M IP-led revenue"
    bullet: "bul_unify_006"
    preservation: "EXACT"
  - metric: "20% gross margin expansion"
    bullet: "bul_unify_006"
    preservation: "EXACT"
  - metric: "8 to 28 specialists"
    bullet: "bul_unify_006"
    preservation: "EXACT_OR_EQUIVALENT"
    equivalent_allowed: ["scaled team from 8 to 28", "grew ML engineering org 3.5x"]

forbidden_patterns:
  - pattern: "em dash"
    check: "characters U+2014 and U+2013 not allowed"
    action: "REJECT"
  - pattern: "narrative paragraph"
    check: "output.bullets must not contain paragraph breaks or narrative flow"
    action: "REJECT"
  - pattern: "excessive_jd_copying"
    check: "No more than 4 consecutive words from JD"
    action: "FLAG_AND_REWRITE"
  - pattern: "ibm_fact_contamination"
    check: "source_fact_id must start with bul_unify_*"
    action: "REJECT"
  - pattern: "insurtech_fact_contamination"
    check: "source_fact_id must start with bul_unify_*"
    action: "REJECT"
  - pattern: "ey_fact_contamination"
    check: "source_fact_id must start with bul_unify_*"
    action: "REJECT"
  - pattern: "early_career_contamination"
    check: "source_fact_id must start with bul_unify_*"
    action: "REJECT"

validation_rules:
  pre_output:
    - assert: "len(output.bullets) == 6"
      error: "BULLET_COUNT_INVALID"
      message: "Must emit exactly 6 bullets"
    - assert: "not any([U+2014 in b.bullet_text for b in output.bullets])"
      error: "EM_DASH_DETECTED"
      message: "Em dash character forbidden"
    - assert: "all([b.source_fact_id.startswith('bul_unify_') for b in output.bullets])"
      error: "CROSS_CONTAMINATION"
      message: "All bullets must source from Unify facts only"
  post_output:
    - check: "claim_ledger completeness"
    - check: "gap_notes populated if gaps exist"
    - check: "change_log tracks all modifications"

temperature_profile:
  range: "0.35 - 0.50"
  default: 0.40
  rationale: "Rewrite variation - heavier rewriting needs more controlled creativity"
  sweep_validation: "Must pass at 0.35, 0.425, 0.50 with consistent structure"

payload_scope:
  input_tokens_estimate: "~2,500"
  output_tokens_estimate: "~1,200"
  context_window_required: "4K minimum"
  json_schema_strict: true

# W5 — SSOT excerpt for contract tests (align with sovereign_oath SRFS block).
w5_proof_targeting_harmonization: |
  Proof: SelectedRoleFactSet facts for unify_bullets only; bullets and claim_ledger source_fact_ids must match this
  section's allowlist. Targeting only: JD, briefing, target title, target company, companion sections — emphasis and
  ordering, never proof; do not cite them as source_fact_ids. Out-of-slice source_fact_ids fail X2. No invented
  employers, titles, tools, platforms, partners, alliances, domains, metrics, revenue, savings, percentages, or
  regulated-industry claims unless those unify_bullets selected facts support them; drop unsupported claims rather than inferring from JD.

metadata:
  produced_at: "2026-05-14"
  produced_by: "W2B STOP 5 - Unify Bullet Tailor"
  receipt_path: "artifacts/apps_rg/prompt_reset/w2b_outputs/stop_5_unify_bullet_receipt.json"
