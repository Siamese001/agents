# apps_rg Prompt Assembly Bill of Materials (BOM)
# Schema: 8-slot PA authority model per ADR-023 and AG-RGGOV-6
# Ownership: apps_rg owns this BOM; apps_rg must never modify.

schema_version: "1.0"
bom_id: "bom::apps_rg::resume_generation::v1"
app_id: apps_rg
task_class: resume_generation
version: "1"
status: active

# =============================================================================
# 8-Slot Authority Model
# =============================================================================
# S0: SYSTEM_AUTHORITY — Immutable governance, no-fabrication oath
# D0: BINDING_AUTHORITY — Security fences, injection boundaries  
# I0: GOVERNED_AUTHORITY — App-owned domain instructions
# E0: EXAMPLE_AUTHORITY — Few-shot approved examples
# C0: INFORMATIONAL_AUTHORITY — Retrieved evidence (candidate facts, JD data)
# M0: PROVIDER_RENDER_CONTROL — Model/provider selection, token budgets
# U0: ZERO_AUTHORITY — Neutralized user task (target company/role/level)
# H0: REPAIR_HINTS — Bounded healing guidance
# R0: SCHEMA_AUTHORITY — Output format contract
# Y0: STYLE_AUTHORITY — Synthesis preferences, tone, forbidden phrases

required_slots:
  - S0
  - I0
  - C0
  - U0
  - D0
  - E0
  - Y0
  - R0

optional_slots:
  - H0
  - M0

# =============================================================================
# Slot Definitions
# =============================================================================
slots:
  S0:
    slot_id: S0
    slot_name: S0_SYSTEM_PREAMBLE
    authority_class: SYSTEM_AUTHORITY
    description: Immutable governance including no-fabrication oath
    required: true
    data_boundary: SYSTEM_INTERNAL
    
  D0:
    slot_id: D0
    slot_name: D0_ORIGIN_BOUNDARY
    authority_class: BINDING_AUTHORITY
    description: Security fences and injection boundaries
    required: true
    data_boundary: SECURITY_BOUNDARY
    fence_markers:
      opening: "<untrusted_data>"
      closing: "</untrusted_data>"
    
  I0:
    slot_id: I0
    slot_name: I0_INSTRUCTIONS
    authority_class: GOVERNED_AUTHORITY
    description: App-owned domain instructions for resume generation
    required: true
    data_boundary: APP_INSTRUCTION
    
  C0:
    slot_id: C0
    slot_name: C0_EVIDENCE_DATA
    authority_class: INFORMATIONAL_AUTHORITY
    description: Retrieved evidence — candidate facts, JD requirements, company brief
    required: true
    data_boundary: VERIFIED_EVIDENCE
    source_separation_required: true
    
  U0:
    slot_id: U0
    slot_name: U0_USER_TASK
    authority_class: ZERO_AUTHORITY
    description: Neutralized user intent — target company, role, level
    required: true
    data_boundary: USER_INTENT_ONLY
    
  E0:
    slot_id: E0
    slot_name: E0_APPROVED_EXAMPLES
    authority_class: EXAMPLE_AUTHORITY
    description: Few-shot approved examples (golden resumes)
    required: true
    data_boundary: APPROVED_EXAMPLE_DATA
    
  Y0:
    slot_id: Y0
    slot_name: Y0_STYLE_PREFERENCES
    authority_class: STYLE_AUTHORITY
    description: Synthesis preferences, tone, forbidden phrases, power verbs
    required: true
    data_boundary: APPROVED_USER_STYLE
    advisory_only: true
    
  R0:
    slot_id: R0
    slot_name: R0_RESPONSE_SCHEMA
    authority_class: SCHEMA_AUTHORITY
    description: Output format contract with section-level constraints
    required: true
    data_boundary: SCHEMA_CONTRACT
    
  H0:
    slot_id: H0
    slot_name: H0_HEALING_PROPOSAL
    authority_class: REPAIR_HINTS
    description: Bounded healing guidance for E4 HOP stages
    required: false
    data_boundary: INTERNAL_POLICY
    
  M0:
    slot_id: M0
    slot_name: M0_PROVIDER_CONTROL
    authority_class: PROVIDER_RENDER_CONTROL
    description: Model/provider selection and token budgets
    required: false
    data_boundary: SYSTEM_INTERNAL

# =============================================================================
# Template Registry References
# =============================================================================
template_registry_refs:
  - strategic_tailor_v1
  - tailor_existing_v1
  - generate_scratch_v1
  - enhance_current_v1
  - resume_fact_check_v1
  - unsupported_claim_omission_v1
  - bullet_diversity_repair_v1
  - unify_v1
  - docx_manifest_v1
  # W9 section PA + shared shell (see prompt_registry.yaml)
  - "executive_summary.generate_scratch_v1"
  - headline_tailor_v1
  - competency_selector_v2
  - competency_selector_v2_pa_slots
  - unify_bullet_tailor_v1
  - unify_position_narrative_v1
  - ibm_position_narrative_v1
  - ibm_bullet_tailor_v1
  - w7_strategic_tailor_shell_slots
  # TEST_ONLY / fixtures (registry SSOT; not L2 flow_route)
  - strategic_tailor_v2
  - resume_fact_check_v2
  - unsupported_claim_omission_v2
  - docx_manifest_v2
  - final_unify_v2

# =============================================================================
# Section example authority (E0 voice SSOT — hydrated at compile via e0_examples.py)
# =============================================================================
section_example_authority:
  executive_summary:
    examples_path: apps_rg/prompt_assembly/examples/executive_summary_examples.yaml
    gold_example_id: exec_summary_gold_base_resume_001
    positive_compile_ids:
      - exec_summary_gold_base_resume_001
      - exec_summary_pos_credibility_implied_001
      - exec_summary_pos_outcomes_led_001
      - exec_summary_pos_svp_it_strategy_001
    template_supplement_path: apps_rg/prompt_assembly/templates/executive_summary.generate_scratch_v1.yaml
    template_supplement_tags:
      - transformation_example
  competencies:
    examples_path: apps_rg/prompt_assembly/examples/competencies_examples.yaml
  unify:
    examples_path: apps_rg/prompt_assembly/examples/unify_examples.yaml
    lanes:
      - unify_bullets
      - unify_narrative

# Legacy alias (readers may still reference this key)
executive_summary_example_authority:
  gold_example_id: exec_summary_gold_base_resume_001
  gold_authority_label: E0_STYLE_EXAMPLE_NOT_PROOF
  gold_examples_path: apps_rg/prompt_assembly/examples/executive_summary_examples.yaml
  note: >
    Superseded by section_example_authority.executive_summary — compile hydrates from examples_path.

# =============================================================================
# Hash Fields for Determinism
# =============================================================================
hash_fields:
  - bom_id
  - app_id
  - task_class
  - version
  - required_slots
  - slot_authority_ordering

# =============================================================================
# Origin Label Map (Slot → Origin Classification)
# =============================================================================
origin_label_map:
  S0: system_governance
  D0: security_boundary
  I0: app_instruction
  C0: data_only
  U0: user_intent_only
  E0: approved_example_data
  Y0: approved_user_style
  R0: schema_contract
  H0: internal_policy
  M0: system_internal

# =============================================================================
# Compilation Constraints
# =============================================================================
compilation_constraints:
  max_total_tokens: 4000
  max_prompt_tokens: 3800
  max_response_tokens: 200
  require_slot_fencing: true
  require_origin_labels: true
  require_source_separation_in_c0: true
  require_no_fabrication_oath_in_s0: true
