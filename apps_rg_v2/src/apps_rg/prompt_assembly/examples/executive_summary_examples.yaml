  - id: exec_summary_pos_svp_it_strategy_001
    category: positive_variant
    authority: E0_STYLE_EXAMPLE_NOT_PROOF
    section: executive_summary
    seniority_band: EXECUTIVE
    xml_wrapped: true
    before: null
    after: |
      Enterprise technology leader who aligns governed AI platforms, regulatory lineage, and digital innovation into one IT strategy agenda for decentralized regulated enterprises.
      Designs and operates platform runtime with deterministic controls and traceable execution so innovation scales without sacrificing validation-ready delivery.
      Building on that foundation, supply-chain platform modernization generated $[X]M in efficiency capture and expanded operating margins by [Y]% while growing the platform engineering team from [A] to [B] specialists.
      Against that delivery foundation, SOX and PCAOB lineage discipline reduced financial close errors by [Z]%, accelerating IT strategy velocity without turning compliance into a delivery bottleneck.
      Chartered risk-management credential underpins stress-testing discipline, with containerized batch-processing practice shortening cycle times for capital planning decisions.
      That quantitative and governance foundation enables innovation incubation and federated platform capabilities across decentralized operating units, preserving lineage discipline and investment rigor at enterprise scale.
    claim_ledger_grounded: false
    annotation: >
      STYLE VARIANT — SVP IT strategy register (V11, structural-repair-f4a8c2): S1 uses
      'digital innovation' framing — NOT 'commercialization'. NEVER copy 'commercialization'
      into S1 unless an allowed source_fact_id explicitly carries a revenue/margin outcome fact;
      an undelivered commercialization thread is a thesis_body_gap that Claude-class judges
      score at 3.4 or below. S6 is forward-modal ('enables', 'preserving') — NEVER past-tense
      ('Built', 'Applied', 'Directed'). METRICS INTENTIONALLY TRANSPOSED to a different domain
      (supply-chain/finance) — do NOT copy [X]/[Y]/[A]/[B]/[Z] placeholders; retrieve real
      values from C0 ALLOWED_SOURCE_FACT_IDS. Connective tissue: S2 opens with 'Designs',
      S3-S5 each open with a thesis-referent bridge ('Building on', 'Against that').

