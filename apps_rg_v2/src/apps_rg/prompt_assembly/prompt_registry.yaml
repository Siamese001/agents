    path: templates/executive_summary.generate_scratch_v1.yaml
    version: "1.0"
    allowed_stage: L2_EXEC
    w9_classification: ACTIVE
    runtime_dispatch_reachable: true
    required_slots: [S0, D0, I0, C0, U0, E0, R0]
    optional_slots: [Y0, H0, M0]
    output_contract:
