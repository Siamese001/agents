schema_version: apps_rg.whole_resume_rubric.v1
rubric_id: apps_rg-whole-resume-quality-v1
scope: sealed_completed_artifacts
pair_contract:
  authorized_pair_count: 6
  independent_qualified_resume_coaches_per_pair: 2
  adjudications_per_pair: 1
