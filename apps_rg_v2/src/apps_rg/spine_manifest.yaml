# -----------------------------------------------------------------------------
# Compilation Constraints
# -----------------------------------------------------------------------------
compilation:
  max_response_tokens: 6000
  require_json_output: true
  enforce_slot_order: true
  fail_on_missing_required: true

# -----------------------------------------------------------------------------
# Governance Invariants
# -----------------------------------------------------------------------------
governance:
  # S0 must contain NO FABRICATION oath
  requires_no_fabrication_oath: true
  
  # C0 must have source-separated evidence
  requires_source_separation: true
  
  # All prompts must have deterministic hashes
  requires_deterministic_hashes: true
  
  # Output must be valid JSON per schema
  requires_schema_validation: true

