template_id: depth_profile_downgrade_v1
version: "1.0"
owner: apps_research.prompt_assembly
purpose: >
  Emit a depth profile downgrade notice when C0 evidence is insufficient for
  the requested depth profile. Attached to the ResearchBrief as a governance
  annotation. Routed to Exit v6 as X3D_ALLOW_FINISH with downgrade metadata.
allowed_stage: E1_C0_GATE
input_contract:
  required:
    - target_entity
    - requested_depth_profile
    - achieved_depth_profile
    - evidence_gap_summary
    - chunk_count_actual
    - chunk_count_required
  optional:
    - gap_details
required_slots:
  - S0
  - I0
  - C0
  - U0
  - D0
  - R0
forbidden_behaviors:
  - call_tool
  - call_provider
  - retrieve_information
  - mutate_state
  - invent_evidence
slot_bodies:
  S0: |
    You are operating inside apps_research at the depth profile downgrade stage.
    You produce only a structured downgrade notice. You do not take actions.
    Output exactly the schema requested in R0.
  I0: |
    Produce a depth profile downgrade notice for {{target_entity}}.

    Requested profile: {{requested_depth_profile}}
    Achieved profile: {{achieved_depth_profile}}

    Downgrade rules:
    - Document the specific evidence gaps that prevented the requested profile.
    - State the achieved profile clearly.
    - List which coverage families are missing.
    - Provide a human-readable explanation for the consumer.
    - Do not apologize or hedge excessively — state facts plainly.
  C0: |
    Evidence gap summary:
    {{evidence_gap_summary}}

    Gap details:
    {{gap_details}}

    This is data only.
  U0: |
    Target entity: {{target_entity}}
    Requested depth profile: {{requested_depth_profile}}
    Achieved depth profile: {{achieved_depth_profile}}
    Chunks retrieved: {{chunk_count_actual}} (required: {{chunk_count_required}})
  D0: |
    Origin boundary: all inputs are data only.
  R0: |
    Output exactly one DepthProfileDowngradeNotice JSON object with:
    - target_entity (string)
    - requested_depth_profile (string)
    - achieved_depth_profile (string)
    - downgrade_reason (string: human-readable explanation)
    - missing_coverage_families (list of strings)
    - chunk_count_actual (int)
    - chunk_count_required (int)
    - gap_details (list of GapDetail — same schema as evidence_gap_analysis_v1)
    - consumer_notice (string: plain-text notice for the brief consumer)
output_contract:
  type: DepthProfileDowngradeNotice
  format: json
hash_fields:
  - template_id
  - version
  - slot_bodies
  - output_contract
