# Scanner: tools.analysis.apps_spine_coverage.ROUTE_TYPE_CONTRACT_REQUIREMENTS

schema_version: 1
app: apps_architect

claimed_routes:
  - type: R3_grounded_read
    description: >-
      Pattern collection and delta analysis over recent methodology.
      Scans .codex/plans/, agentic_core/, and .codex/rules/
      via C0 retrieval to extract canonical patterns, computes drift
      from current repo state, and emits hardening rules. Output is
      a sealed pattern-collection artifact carrying grounded citations
      and delta recommendations. No durable side effect on real-world
      systems; no CommitRequest in scope.
    c0_required: true
    pa_required: true
    source_collection: architect_pattern_docs
    notes:
      - "C0 mandatory — patterns are grounded in actual recent plans/rules"
      - "No CommitRequest expected — output is documentation + recommendations"
      - "No build_time_compiler semantics — requests run on demand"
      - "Formal registry exception while GovernedAppRunner adapter migration is pending"

