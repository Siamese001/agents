      EmbeddingSovereignAgent must reach the embedding provider through the
      sanctioned factory (create_embedding_client) so all provider-SDK traffic
      routes through apps_rg.embeddings.embedding_factory. Removing this
      call would leave the approved adapter structurally orphan.
    entry_module: apps_rg/L2_execution/reasoning/EmbeddingSovereignAgent.py
    entry_symbol: EmbeddingSovereignAgent
    required_call: create_embedding_client
    required_env_flags: []
    signature_contract:
      # create_embedding_client(provider, model) — both positional, no kwargs.
      # A silent drop of the model arg would fall back to a default embedding
      # model and silently change retrieval semantics.
      min_args: 2
      max_args: 2
    proof_test: tests/integration/retrieval_layers/test_bge_embedding_e2e.py
    plan_id: lazy-import-arch-defect-review

