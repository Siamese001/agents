  # --------------------------------------------------------------------
  # P2.3 rollout from l0-context-prompt-retrieval-review-b7c4a2 — 2026-04-22
  # L0 prompt assembly / C0 retrieval — closes the bypass class of gap
  # that let assemble_from_bom and load_context_jit go dormant in
  # production while still passing every existing ADG CI gate.
  # --------------------------------------------------------------------

  - id: l0-adapter-calls-assemble-from-bom
    description: >-
      GovernedPromptAdapter._assemble_artifact MUST delegate to the canonical
      AirlockAssembler.assemble_from_bom pipeline. A hand-built artifact in
      the adapter bypasses the AssemblyInjectionNeutralizer, slot-order
      validator, and JIT C0 context load — all of which are governance
      controls. This row fails-closed the moment a future edit re-introduces
      the bypass seen in l0-context-prompt-retrieval-review-b7c4a2.
    entry_module: apps_shared/utils/governed_prompt_adapter.py
    entry_symbol: GovernedPromptAdapter._assemble_artifact
    required_call: assemble_from_bom
    required_env_flags: []
    proof_test: tests/integration/apps_exec/test_prompt_lifecycle_pipeline.py
    plan_id: l0-context-prompt-retrieval-review-b7c4a2

  - id: l0-assembly-stage-jit-context
    description: >-
      AirlockAssembler.assemble_from_bom MUST invoke load_context_jit to
      populate the C0 slot with live RAG + BM25 + AST + boundary-ref
      retrieval. Without this call C0 is only whatever the caller hand-fed
      via bom.raw_c0, which silently disables the entire elevator-shaft
      retrieval seam.
    entry_module: apps_rg/L0_routing/reasoning/assembly_stage.py
    entry_symbol: AirlockAssembler.assemble_from_bom
    required_call: load_context_jit
    required_env_flags: []
    proof_test: tests/unit/apps_rg/L0_routing/utils/test_elevator_shaft_seam.py
    plan_id: l0-context-prompt-retrieval-review-b7c4a2

  - id: l0-assembly-injection-neutralizer
    # ``AssemblyInjectionNeutralizer`` is reached through the module-level
    # ``_get_neutralizer()`` lazy-factory pattern (assembly_stage.py:43-48)
    # because the class lives in apps_rg.prompt_governance.security and
    # cannot be eagerly imported from L0 without re-creating the L0 -> L_PG
    # layer violation that ADR-024 corrected. The runtime call chain is:
    #   assemble_from_bom -> _get_neutralizer() -> neutralizer_cls() -> .neutralize()
    # The static AST walker only scans the entry_symbol subtree and helper
    # methods on the same class, so it cannot follow the module-level helper.
    # We anchor the wiring assertion on ``_get_neutralizer`` (which IS called
    # inside assemble_from_bom at line 1199) - same end-to-end guarantee with
    # an AST-visible target. The proof_test still validates the full chain.
    description: >-
      AirlockAssembler.assemble_from_bom MUST reach the neutralizer factory
      `_get_neutralizer()` so AssemblyInjectionNeutralizer is instantiated and
      U0 prompt-injection defense runs before the artifact is signed.
      Dropping this call lets a user prompt smuggle role-override tokens past
      the governance boundary.
    entry_module: apps_rg/L0_routing/reasoning/assembly_stage.py
    entry_symbol: AirlockAssembler.assemble_from_bom
    required_call: _get_neutralizer
    required_env_flags: []
    proof_test: tests/integration/apps_exec/test_prompt_lifecycle_pipeline.py
    plan_id: l0-context-prompt-retrieval-review-b7c4a2
