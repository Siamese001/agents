# Retrieval QRELS Calibration Manifest (DIE Parity v2.0)
# --------------------------------------------------------------------------
# Authoritative frozen QRELS calibration specification across:
#   - Candidate Evidence Graph (augmented_skills_graph.sqlite):
#     resume_graph_engine (QuadGraphHybridRetriever) + outreach_engine
#     (QuadHybridCandidateRetriever)
#   - Research Retrieval Store (apps_research/engines/research_retrieval_engine.py)
#
# Invariants:
#   - Corpus-first 4-channel unweighted TREC Depth-10 pooling (Dense 1024-d,
#     Learned Sparse, ColBERT MaxSim, FTS5 BM25) + verified target anchor.
#   - Behavior-anchored 4-point relevance scale (3, 2, 1, 0) bound to
#     config/governance/external_qrels_rubric_v1.json.
#   - Zero-leakage topic-grouped splits: dev, calibration, final_holdout.
#   - Explicit unanswerable negative probes for abstention calibration.
# --------------------------------------------------------------------------

schema_version: 2
status: frozen
frozen_at: "2026-11-23T06:15:00Z"
rubric_ref: config/governance/external_qrels_rubric_v1.json
tenant_id: calibration

corpus:
  sources:
    - kind: candidate_graph_sqlite
      root: resume_graph_engine/artifacts/apps_rg/fact_inventory/augmented_skills_graph.sqlite
      retriever_ref: infrastructure.candidate_evidence.quad_hybrid_retriever.QuadHybridCandidateRetriever
      resume_retriever_ref: apps_rg.runtime.quad_graph_retriever.QuadGraphHybridRetriever
      channels: [dense, sparse, colbert, bm25]
      require_external_eligible: true
      exclude_classifications: [restricted, career_private]
    - kind: research_retrieval_store
      root: apps_research/engines/research_retrieval_engine.py
      retriever_ref: apps_research.engines.research_retrieval_engine.InMemoryResearchStore
      embedding_dim: 1024
  pooling:
    protocol: trec_depth_10_unweighted_union
    top_k_per_channel: 10
    include_verified_target: true
    core_statement_only_grading: true
    display_date_format: MM/DD/YYYY

datasets:
  query_set: data/qrels/qrels_query_set.v1.json
  partitions: data/qrels/qrels_partitions.v1.json
  candidate_pool: data/qrels/qrels_authentic_candidate_pool.v1.json
  ground_truth: data/qrels/qrels_independent_ground_truth.v1.json
  weight_calibration: data/qrels/qrels_weight_calibration_results.v1.json

eval_axes:
  retrieval_quality:
    - ndcg_at_10
    - mrr_at_10
    - recall_at_5
    - recall_at_10
  inter_rater_calibration:
    - cohens_kappa
    - quadratic_weighted_kappa
    - sparse_krippendorffs_alpha
    - one_sided_95_upper_error_bound
  behavioural:
    - abstention_true_positive_rate
    - false_abstain_count
    - top1_vs_top2_margin
    - channel_ablation_delta

acceptance_gates:
  qrels_coverage:
    min_total_queries: 50
    min_unanswerable_probes: 5
    min_total_candidates_judged: 1000
    max_topic_family_overlap: 0
    require_grade_3_present: true
    require_grade_1_present: true
    min_cohens_kappa: 0.80
    min_quadratic_weighted_kappa: 0.80
  weight_calibration:
    simplex_grid_step: 0.05
    simplex_grid_size: 1771
    max_delta_ndcg_10_for_validation: 0.02
    max_false_abstains: 0
    min_negative_probe_abstention_rate: 1.0
    require_holdout_beats_bm25_only: true
    require_holdout_beats_dense_only: true
