# Canonical Governance Policy Registry (SSOT)
# Schema Version: 1.1.0
# Machine-readable single source of truth for all quantitative, structural,
# and lifecycle invariants across the Antigravity Agents repository.

version: "1.1.0"
updated_at: "2026-11-01T11:30:00Z"
description: "Single Source of Truth for repository governance thresholds, budgets, and invariant enforcers."

policies:
  - id: "INV-BUDGET-FILE-LINES"
    title: "Production File Size Line Budget"
    category: "architecture"
    threshold: 600
    unit: "lines"
    description: "Maximum allowable lines per production Python file outside baseline ratchet exemptions."
    enforcer: "tools/lint_file_budgets.py"
    rule_reference: ".agents/rules/conformance-map.md"

  - id: "INV-AGENTS-MD-MAX-LINES"
    title: "AGENTS.md Concise Operating Contract Ceiling"
    category: "context_management"
    threshold: 200
    unit: "lines"
    description: "Maximum allowable line count for root AGENTS.md to prevent context compaction truncation."
    enforcer: "tools/validate_turn_gates.py"
    rule_reference: "AGENTS.md"

  - id: "INV-SKILLS-BUDGET-MAX-TOKENS"
    title: "Workspace Skills Description Token Budget"
    category: "context_management"
    threshold: 4000
    unit: "tokens"
    description: "Maximum total estimated token budget across all .agents/skills/*/SKILL.md descriptions."
    enforcer: "tools/validate_turn_gates.py"
    rule_reference: "AGENTS.md"

  - id: "INV-HITL-AMBIGUITY-MARGIN"
    title: "HITL Ambiguity Margin Threshold"
    category: "decision_intelligence"
    threshold: 0.20
    boundary_inclusivity: "<="
    unit: "fraction"
    description: "Confidence spread between top two options at or below which (Delta <= 0.20) Human-in-the-Loop review is required."
    enforcer: "tools/hitl_governance.py"
    rule_reference: ".agents/rules/conformance-map.md"

  - id: "INV-HITL-MIN-CONFIDENCE-FLOOR"
    title: "Minimum Autonomous Confidence Floor"
    category: "decision_intelligence"
    threshold: 0.65
    boundary_inclusivity: ">="
    unit: "fraction"
    description: "Minimum top-option confidence required (top_confidence >= 0.65) before tactical decisions may proceed autonomously."
    enforcer: "tools/hitl_governance.py"
    rule_reference: ".agents/rules/conformance-map.md"

  - id: "INV-DECISIVE-RECOMMENDATION"
    title: "Decisive Recommendation & Zero-Fence-Sitting Standard"
    category: "decision_intelligence"
    threshold: 0
    unit: "disjunctive_phrases"
    description: "Assistant turns must never conclude with plain-text disjunctive option prose without invoking ask_question."
    enforcer: "tools/hook_dispatch.py"
    rule_reference: ".agents/rules/conformance-map.md"

  - id: "INV-HITL-QUESTION-MAX-CHARS"
    title: "Maximum HITL Question Prompt Length"
    category: "decision_intelligence"
    threshold: 300
    unit: "characters"
    description: "Maximum allowable character length for ask_question prompt text so every character is visible without UI truncation."
    enforcer: "tools/hitl_governance.py"
    rule_reference: ".agents/rules/hitl-decisions.md"

  - id: "INV-HITL-OPTION-MAX-CHARS"
    title: "Maximum HITL Option Label Length"
    category: "decision_intelligence"
    threshold: 250
    unit: "characters"
    description: "Maximum allowable character length per ask_question option string so every option is visible without UI truncation."
    enforcer: "tools/hitl_governance.py"
    rule_reference: ".agents/rules/hitl-decisions.md"

  - id: "INV-HITL-ZERO-JARGON"
    title: "Zero-Jargon Plain-English Question & Option Standard"
    category: "decision_intelligence"
    threshold: 0
    unit: "jargon_violations"
    description: "Both question prompt and option labels in ask_question must contain zero technical jargon, code symbols, file paths, or truncation ellipses."
    enforcer: "tools/hitl_governance.py"
    rule_reference: ".agents/rules/hitl-decisions.md"

  - id: "INV-TEST-TIMEOUT-HARD"
    title: "Hard Pytest Execution Timeout"
    category: "testing"
    threshold: 180
    unit: "seconds"
    description: "Hard per-test timeout enforced across pytest configuration and runner."
    enforcer: "pytest.ini"
    rule_reference: "AGENTS.md"

  - id: "INV-WAVE-PLAN-MAX-WORDS"
    title: "Maximum New Wave Plan Length"
    category: "planning"
    threshold: 1000
    unit: "words"
    description: "Maximum word budget for newly authored wave-based implementation plans."
    enforcer: "tools/validate_implementation_plan.py"
    rule_reference: "docs/refactoring-wave-protocol.md"

  - id: "INV-OUTPUT-MAX-WORDS"
    title: "Maximum Engineering Completion Word Ceiling"
    category: "presentation"
    threshold: 300
    unit: "words"
    description: "Maximum allowable whitespace-delimited words in ordinary turn completion response (target ~120 words)."
    enforcer: "tools/validate_turn_gates.py"
    rule_reference: ".agents/rules/output-brevity-governance.md"

  - id: "INV-OUTPUT-MAX-CHARS"
    title: "Maximum Engineering Completion Character Ceiling"
    category: "presentation"
    threshold: 3500
    unit: "characters"
    description: "Maximum allowable raw characters in ordinary turn completion response."
    enforcer: "tools/validate_turn_gates.py"
    rule_reference: ".agents/rules/output-brevity-governance.md"

  - id: "INV-DIRECT-INQUIRY-GROUNDING"
    title: "Direct Inquiry Grounding & Anti-Evasion Invariant"
    category: "presentation"
    threshold: 1
    unit: "direct_dimension_coverage"
    description: "Itemized technical dimensions in user prompts must be addressed directly in chat without generic analogies or abstract process deflection."
    enforcer: "tools/validate_turn_gates.py"
    rule_reference: ".agents/rules/output-brevity-governance.md"

  - id: "INV-WT-ISOLATION"
    title: "Primary Main Worktree Write Protection"
    category: "git_governance"
    threshold: 1
    unit: "worktree_parity"
    description: "Direct modifications to tracked files on branch main in the primary root workspace are blocked."
    enforcer: "tools/hook_dispatch.py"
    rule_reference: ".agents/rules/pr-governance.md"

  - id: "INV-SSOT-ZERO-SHADOW-CONFIGS"
    title: "Zero Unsynchronized Shadow Configuration Sprawl"
    category: "ssot_centralization"
    threshold: 0
    unit: "shadow_divergences"
    description: "All configuration, schema, and profile surfaces across all 9 packages must synchronize with canonical owners in centralization_registry.yaml with zero intra-file or twin-file contradictions."
    enforcer: "tools/ssot_sprawl_scanner.py"
    rule_reference: "automations/prompts/agents_ssot_boundary_agent.md"

  - id: "INV-SSOT-ZERO-HARDCODED-THRESHOLDS"
    title: "Zero Unowned Hardcoded Domain or Governance Thresholds"
    category: "ssot_centralization"
    threshold: 0
    unit: "hardcoded_literals"
    description: "Word, character, sentence, token, retry, and timeout thresholds plus environment lookups must resolve from canonical owners without magic-number duplication."
    enforcer: "tools/ssot_hardcoding_scanner.py"
    rule_reference: "automations/prompts/agents_ssot_boundary_agent.md"

  - id: "INV-SSOT-PROMPT-CODE-PARITY"
    title: "Prompt Instruction to Runtime Validator Numeric Parity"
    category: "ssot_centralization"
    threshold: 0
    unit: "parity_mismatches"
    description: "Numeric bounds embedded in prompt templates, repair builders, judge rubrics, and eval expectations must match canonical runtime validator constants."
    enforcer: "tools/ssot_hardcoding_scanner.py"
    rule_reference: "automations/prompts/agents_ssot_boundary_agent.md"

  - id: "INV-SSOT-POLICY-REGISTRY-SYNC"
    title: "Governance Enforcer and Rule Policy Registry Synchronization"
    category: "ssot_centralization"
    threshold: 0
    unit: "unsynced_enforcers"
    description: "Every enforcer script and markdown rule referenced in policy_registry.yaml must enforce the exact registered threshold without hardcoded drift."
    enforcer: "tools/ssot_hardcoding_scanner.py"
    rule_reference: "config/governance/policy_registry.yaml"
