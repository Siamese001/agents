# Canonical Centralization & Domain Ownership Registry (SSOT)
# Schema Version: 1.0.0
# Maps every shared threshold, domain product-shape bound, channel ceiling,
# research mode budget, evaluation bound, timeout, and environment namespace
# to its single authoritative owner across the repository.

version: "1.0.0"
updated_at: "2026-11-03T05:20:00Z"
description: "Authoritative ownership map enforcing zero configuration sprawl and zero unowned threshold literals."

canonical_config_roots:
  governance_policies: "config/governance/policy_registry.yaml"
  centralization_map: "config/governance/centralization_registry.yaml"
  model_catalog: "config/model_catalog.json"
  provider_profiles: "config/provider_profiles.yaml"
  root_schemas: "config/schemas"
  exit_eval_rubrics: "config/exit_eval_rubrics"

shadow_copy_pairs:
  - canonical: "config/provider_profiles.yaml"
    mirrors:
      - "resume_graph_engine/src/apps_rg/config/provider_profiles.yaml"
    policy: "MUST_MATCH_OR_IMPORT_CANONICAL"
  - canonical: ".mcp.json"
    mirrors:
      - ".agents/mcp_config.json"
    policy: "PORTABLE_SERVER_PARITY"
  - canonical: "pytest.ini"
    mirrors:
      - "resume_graph_engine/pytest.ini"
    policy: "TIMEOUT_AND_ADDOPTS_PARITY"

domain_threshold_owners:
  governance_turn_and_plan_budgets:
    owner_file: "config/governance/policy_registry.yaml"
    canonical_symbols:
      INV-BUDGET-FILE-LINES: 600
      INV-AGENTS-MD-MAX-LINES: 200
      INV-SKILLS-BUDGET-MAX-TOKENS: 4000
      INV-HITL-AMBIGUITY-MARGIN: 0.20
      INV-HITL-MIN-CONFIDENCE-FLOOR: 0.65
      INV-TEST-TIMEOUT-HARD: 180
      INV-WAVE-PLAN-MAX-WORDS: 1000
      INV-OUTPUT-MAX-WORDS: 300
      INV-OUTPUT-MAX-CHARS: 3500
    required_consumers:
      - "tools/validate_turn_gates.py"
      - "tools/implementation_plan_core/evidence_requirements.py"
      - "tools/lint_file_budgets.py"
      - "tools/hitl_governance.py"
      - "AGENTS.md"
      - ".agents/rules/output-brevity-governance.md"
      - ".agents/rules/plan-first-enforcement.md"
      - ".agents/rules/wave-progression.md"

  resume_executive_summary_shape:
    owner_file: "resume_graph_engine/src/apps_rg/runtime/validators/executive_summary_x2.py"
    Aggregator_ssot: "resume_graph_engine/src/apps_rg/runtime/sections/section_product_shape_ssot.py"
    canonical_symbols:
      EXEC_SUMMARY_MAX_WORDS: 150
      EXEC_SUMMARY_MAX_WORDS_PER_SENTENCE: 45
      EXEC_SUMMARY_MIN_SENTENCES: 6
      EXEC_SUMMARY_MAX_SENTENCES: 6
    governed_surfaces:
      - "resume_graph_engine/src/apps_rg/rg_output_schema.json"
      - "resume_graph_engine/src/apps_rg/rg_style_profile.yaml"
      - "resume_graph_engine/src/apps_rg/prompt_assembly/section_contracts/executive_summary_contract.yaml"
      - "resume_graph_engine/src/apps_rg/prompt_assembly/templates/strategic_tailor_v1.yaml"
      - "resume_graph_engine/src/apps_rg/runtime/sections/executive_summary/policy.py"
      - "resume_graph_engine/src/apps_rg/runtime/sections/executive_summary/word_budget_repair.py"
      - "resume_graph_engine/src/apps_rg/runtime/sections/executive_summary_lane.py"
      - "apps_eval/scenarios.py"

  resume_narrative_and_headline_shape:
    owner_file: "resume_graph_engine/src/apps_rg/runtime/sections/section_product_shape_ssot.py"
    canonical_symbols:
      NARRATIVE_MAX_WORDS: 58
      NARRATIVE_MAX_CHARS: 360
      NARRATIVE_PREFERRED_WORD_MIN: 34
      NARRATIVE_PREFERRED_WORD_MAX: 48
      HEADLINE_WORD_MIN: 10
      HEADLINE_WORD_MAX: 13
      HEADLINE_MAX_CHARS: 140
    governed_surfaces:
      - "resume_graph_engine/src/apps_rg/rg_output_schema.json"
      - "resume_graph_engine/src/apps_rg/prompt_assembly/templates/unify_position_narrative_v1.yaml"
      - "resume_graph_engine/src/apps_rg/prompt_assembly/templates/strategic_tailor_v2.yaml"
      - "resume_graph_engine/src/apps_rg/runtime/sections/role_episode_lane.py"
      - "resume_graph_engine/src/apps_rg/runtime/sections/ibm_narrative_pa.py"
      - "resume_graph_engine/src/apps_rg/runtime/sections/unify_narrative_pa.py"

  outreach_channel_bounds:
    owner_file: "outreach_engine/src/apps_lic/domain/validators.py"
    canonical_symbols:
      LINKEDIN_CONNECTION_MAX_CHARS: 300
      LINKEDIN_INMAIL_MAX_CHARS: 1900
      EMAIL_MAX_CHARS: 1500
      FOLLOW_UP_MAX_CHARS: 800
    governed_surfaces:
      - "apps_eval/rubrics/apps_lic_outreach_v1.yaml"
      - "apps_eval/fixtures/dev/apps_lic"

  research_mode_word_budgets:
    owner_file: "apps_research/config/agent_spec_config.py"
    canonical_symbols:
      DEFAULT_MAX_WORDS: 1500
      BRIEF_MAX_WORDS: 1200
      COMPARISON_MAX_WORDS: 2000
      TREND_MAX_WORDS: 1500
      POSITION_MAX_WORDS: 1800
      THOUGHT_LEADERSHIP_MAX_WORDS: 800
    governed_surfaces:
      - "apps_research/prompt_assembly/templates/company_brief_synthesis_v1.yaml"
      - "apps_research/config/domain_contract/output_schema.yaml"
      - "apps_research/config/domain_contract/output_schema.company_brief.v1.json"

approved_env_loader_paths:
  - "infrastructure/"
  - "config/"
  - "tools/"
  - "ops_scripts/"
  - "scripts/"
  - "resume_graph_engine/src/apps_rg/config/"
  - "resume_graph_engine/src/apps_rg/runtime/sections/executive_summary_repair_policy.py"
